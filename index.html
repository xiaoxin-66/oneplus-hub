<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>满天星 - OnePlus</title>
<style>
@property --angle {
  syntax: '<angle>';
  initial-value: 0deg;
  inherits: true;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --angle: 0deg;
  --text: #eef2ff;
  --muted: rgba(214, 226, 255, .46);
}

html, body { height: 100%; }

body {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: safe center;
  justify-content: safe center;
  padding: 15px 12px; /* 缩小了页面外边距 */
  font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  color: var(--text);
  background: #04060a;
  background-image: radial-gradient(circle at 50% 0%, #0d1425 0%, #04060a 100%);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

/* ================= 闪烁星空背景 ================= */
.stars {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background-image: 
    radial-gradient(1.5px 1.5px at 20px 30px, #fff, rgba(0,0,0,0)),
    radial-gradient(1px 1px at 40px 70px, #fff, rgba(0,0,0,0)),
    radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
    radial-gradient(1.5px 1.5px at 160px 120px, #fff, rgba(0,0,0,0));
  background-repeat: repeat;
  background-size: 200px 150px;
  animation: twinkle 4s infinite alternate;
}

@keyframes twinkle {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}

.orb {
  position: fixed;
  z-index: 1;
  border-radius: 50%;
  filter: blur(100px);
  pointer-events: none;
  opacity: .15;
}
.orb-1 { width: 350px; height: 350px; background: #2f6bff; top: -100px; left: -100px; }
.orb-2 { width: 350px; height: 350px; background: #8b3bff; bottom: -100px; right: -100px; }

/* ================= 主卡片（动态流光边框） ================= */
.card {
  position: relative;
  z-index: 10;
  width: 100%;
  max-width: 360px; /* 尺寸缩小 */
  padding: 2.5px; /* 边框微宽，防止断层 */
  border-radius: 22px;
  background: conic-gradient(from var(--angle),
    #2f6bff, #8b5cf6 22%, #ff4d6d 42%, #ff9d3d 58%, #2f6bff 78%, #2f6bff 100%);
  box-shadow: 0 20px 60px -20px rgba(0, 0, 0, .9), 0 0 40px -20px rgba(90, 120, 255, .6);
  overflow: hidden;
  /* 硬件加速，防闪烁 */
  animation: spin 8s linear infinite;
  transform: translateZ(0);
  will-change: transform;
}

@keyframes spin {
  to { --angle: 360deg; }
}

.card-inner {
  position: relative;
  isolation: isolate;
  padding: 22px 18px 18px;
  border-radius: 19.5px; /* 匹配外层 */
  overflow: hidden;
  background: rgba(13, 18, 30, 0.92); 
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  transform: translateZ(0);
}

/* ================= 公告栏 ================= */
.notice-bar {
  position: relative;
  z-index: 11;
  display: flex;
  align-items: center;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 10px;
  padding: 6px 10px;
  margin-bottom: 16px;
  font-size: 11.5px;
  color: #ffca6b;
  overflow: hidden;
}

.notice-icon {
  flex-shrink: 0;
  margin-right: 6px;
}

.notice-content {
  flex: 1;
  overflow: hidden;
}

.notice-track {
  display: inline-flex;
  white-space: nowrap;
  animation: marquee 15s linear infinite;
}

.notice-track span {
  padding-right: 30px;
}

.notice-bar:hover .notice-track {
  animation-play-state: paused;
}

@keyframes marquee {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

/* ================= 头部 ================= */
.head {
  position: relative;
  z-index: 11;
  text-align: center;
  margin-bottom: 16px;
}

.logo {
  position: relative;
  width: 50px; height: 50px;
  margin: 0 auto 10px;
  border-radius: 15px;
  display: grid;
  place-items: center;
  font-size: 20px;
  font-weight: 900;
  color: #fff;
  background: linear-gradient(145deg, #ff4d4d, #ff3b30 40%, #d81b1b);
  box-shadow: 0 8px 20px -6px rgba(255, 60, 60, .55), inset 0 1px 0 rgba(255, 255, 255, .45);
}
.logo::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(160deg, rgba(255, 255, 255, .34), transparent 46%);
  pointer-events: none;
}

h1 {
  margin-bottom: 6px;
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 1px;
  background: linear-gradient(100deg, #ffffff 10%, #b9ccff 55%, #d9b6ff 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 6px;
}

.brand {
  font-size: 13px;
  font-weight: 800;
  font-family: "Arial", sans-serif;
  background: linear-gradient(135deg, #ff4d4d, #d81b1b);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.meta-group {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  margin-bottom: 16px;
}

.meta {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 100px;
  font-size: 10.5px;
  color: var(--muted);
  background: rgba(255, 255, 255, .045);
  border: 1px solid rgba(255, 255, 255, .07);
}

.dot {
  width: 4px; height: 4px;
  border-radius: 50%;
  background: #3ddc84;
  box-shadow: 0 0 6px #3ddc84;
}

.quote {
  font-size: 11px;
  color: #a0b0d0;
  font-style: italic;
  opacity: 0.8;
}

/* ================= 按钮列表 ================= */
.btns {
  position: relative;
  z-index: 11;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.btn {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 12px;
  overflow: hidden;
  text-decoration: none;
  color: var(--text);
  background: linear-gradient(135deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, .018));
  border: 1px solid rgba(255, 255, 255, .075);
  transition: transform .2s, border-color .2s, background .2s;
  cursor: pointer;
}

.btn::after {
  content: '';
  position: absolute;
  left: 0; top: 50%;
  width: 2px; height: 0;
  border-radius: 0 2px 2px 0;
  transform: translateY(-50%);
  background: var(--accent);
  transition: height .2s ease;
}
.btn:hover::after { height: 50%; }
.btn:active { transform: translateY(0) scale(.98); }

.icon {
  flex: 0 0 auto;
  width: 34px; height: 34px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  color: var(--accent);
}
.icon svg { width: 18px; height: 18px; }

.text { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 1px; }
.label { display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 650; white-space: nowrap; }
.desc { font-size: 10.5px; color: rgba(214, 226, 255, 0.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.tag { padding: 1px 4px; border-radius: 4px; font-size: 8.5px; font-weight: 700; }
.tag-vpn { color: #ffca6b; background: rgba(255, 170, 40, .12); border: 1px solid rgba(255, 170, 40, .3); }
.tag-paid { color: #ff6b6b; background: rgba(255, 107, 107, .12); border: 1px solid rgba(255, 107, 107, .3); }
.tag-free { color: #3ddc84; background: rgba(61, 220, 132, .12); border: 1px solid rgba(61, 220, 132, .3); }

.arrow { width: 18px; height: 18px; display: grid; place-items: center; color: rgba(255, 255, 255, .26); }
.arrow svg { width: 14px; height: 14px; }

/* 按钮主题色 */

.btn-env:hover { border-color: rgba(45, 212, 167, .42); background: linear-gradient(135deg, rgba(45, 212, 167, .1), rgba(255, 255, 255, .02)); }

.btn-qq:hover { border-color: rgba(168, 85, 247, .42); background: linear-gradient(135deg, rgba(168, 85, 247, .1), rgba(255, 255, 255, .02)); }

.btn-tg { --accent: #29b6f6; } .btn-tg .icon { background: rgba(41, 182, 246, .13); }
.btn-tg:hover { border-color: rgba(41, 182, 246, .42); background: linear-gradient(135deg, rgba(41, 182, 246, .1), rgba(255, 255, 255, .02)); }

.btn-key { --accent: #eab308; } .btn-key .icon { background: rgba(234, 179, 8, .13); }
.btn-key:hover { border-color: rgba(234, 179, 8, .42); background: linear-gradient(135deg, rgba(234, 179, 8, .1), rgba(255, 255, 255, .02)); }

/* 底部 */
.foot {

  text-align: center;
  font-size: 10px;
  color: rgba(214, 226, 255, .35);
  display: flex; flex-direction: column; gap: 4px;
}

</style>
</head>

  // 防审查元素（防右键、防 F12）
  (function() {
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'F12' || e.keyCode === 123) { e.preventDefault(); return false; }
      if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'C' || e.key === 'c' || e.key === 'J' || e.key === 'j')) {
        e.preventDefault(); return false;
      }
      if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) { e.preventDefault(); return false; }
    });
  })();
