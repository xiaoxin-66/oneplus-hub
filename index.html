<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>满天星 - OnePlus</title>
<style>
@property --angle {
  syntax: '<angle>';
  initial-value: 0deg;
  inherits: true;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --angle: 0deg;
  --text: #eef2ff;
  --muted: rgba(214, 226, 255, .46);
}

html, body { height: 100%; }

body {
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 28px 18px;
  font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  color: var(--text);
  /* 改为纯粹的深空黑蓝色，去掉了原本刺眼的彩色光晕 */
  background: #04060a; 
  background-image: radial-gradient(circle at 50% 0%, #0d1425 0%, #04060a 100%);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
/* 满天星背景 */
.stars {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: 
    radial-gradient(1.5px 1.5px at 20px 30px, #fff, rgba(0,0,0,0)),
    radial-gradient(1px 1px at 40px 70px, #fff, rgba(0,0,0,0)),
    radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
    radial-gradient(1.5px 1.5px at 160px 120px, #fff, rgba(0,0,0,0)),
    radial-gradient(1px 1px at 230px 80px, #fff, rgba(0,0,0,0)),
    radial-gradient(2px 2px at 280px 160px, #fff, rgba(0,0,0,0));
  background-repeat: repeat;
  background-size: 300px 200px;
  animation: twinkle 4s infinite alternate;
}
@keyframes twinkle {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}
.bg-grid {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(255, 255, 255, .022) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, .022) 1px, transparent 1px);
  background-size: 54px 54px;
  -webkit-mask-image: radial-gradient(ellipse 65% 55% at 50% 45%, #000 20%, transparent 78%);
  mask-image: radial-gradient(ellipse 65% 55% at 50% 45%, #000 20%, transparent 78%);
}

.orb {
  position: fixed;
  z-index: 0;
  border-radius: 50%;
  filter: blur(120px);
  pointer-events: none;
  opacity: .15; /* 从 0.5 降到 0.15，让光晕变成非常微弱的底光 */
}
.orb-1 { width: 440px; height: 440px; background: #2f6bff; top: -170px; left: -130px; animation: drift1 17s ease-in-out infinite; }
.orb-2 { width: 420px; height: 420px; background: #8b3bff; bottom: -190px; right: -130px; animation: drift2 20s ease-in-out infinite; }
.orb-3 { width: 300px; height: 300px; background: #ff3b6b; top: 56%; left: 62%; opacity: .2; animation: drift3 23s ease-in-out infinite; }

@keyframes drift1 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50%      { transform: translate(70px, 60px) scale(1.14); }
}
@keyframes drift2 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50%      { transform: translate(-70px, -60px) scale(1.12); }
}
@keyframes drift3 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50%      { transform: translate(-50px, 40px) scale(1.2); }
}
/* 卡片（渐变流光描边） */
.card {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 432px;
  padding: 1px;
  border-radius: 28px;
  background: conic-gradient(from var(--angle),
    #2f6bff, #8b5cf6 22%, #ff4d6d 42%, #ff9d3d 58%, #2f6bff 78%, #2f6bff 100%);
  box-shadow:
    0 34px 90px -28px rgba(0, 0, 0, .92),
    0 0 80px -32px rgba(90, 120, 255, .6);
  animation:
    cardIn .85s cubic-bezier(.2, .8, .2, 1) both,
    spin 9s linear infinite;
}
@keyframes spin { to { --angle: 360deg; } }

@keyframes cardIn {
  from { opacity: 0; transform: translateY(22px) scale(.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.card-inner {
  position: relative;
  isolation: isolate;
  padding: 34px 20px 22px;
  border-radius: 26.5px;
  overflow: hidden;
  /* 加深背景不透明度，让文字更清晰 */
  background: rgba(13, 18, 30, 0.92);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
}
.card-inner::before {
  content: '';
  position: absolute;
  top: 0; left: 12%; right: 12%;
  height: 1px;
  z-index: 2;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .42), transparent);
}
.spotlight {
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0;
  transition: opacity .35s ease;
  background: radial-gradient(340px circle at var(--mx, 50%) var(--my, 0%),
    rgba(120, 160, 255, .10), transparent 62%);
}
.card:hover .spotlight { opacity: 1; }

/* 头部 */
.head {
  position: relative;
  z-index: 1;
  text-align: center;
  margin-bottom: 26px;
}

.logo {
  position: relative;
  width: 66px; height: 66px;
  margin: 0 auto 18px;
  border-radius: 20px;
  display: grid;
  place-items: center;
  overflow: hidden;
  font-size: 25px;
  font-weight: 900;
  letter-spacing: -.5px;
  color: #fff;
  background: linear-gradient(145deg, #ff4d4d, #ff3b30 40%, #d81b1b);
  box-shadow:
    0 14px 34px -8px rgba(255, 60, 60, .55),
    inset 0 1px 0 rgba(255, 255, 255, .45),
    inset 0 -10px 20px -12px rgba(0, 0, 0, .6);
}
.logo::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(160deg, rgba(255, 255, 255, .34), transparent 46%);
  pointer-events: none;
}
h1 {
  margin-bottom: 10px;
  font-size: 26px;
  font-weight: 900;
  letter-spacing: 1px;
  background: linear-gradient(100deg, #ffffff 10%, #b9ccff 55%, #d9b6ff 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 8px;
  animation: titlePulse 3s infinite alternate;
}

@keyframes titlePulse {
  from { text-shadow: 0 0 10px rgba(185, 204, 255, 0.2); }
  to { text-shadow: 0 0 25px rgba(185, 204, 255, 0.7), 0 0 35px rgba(217, 182, 255, 0.4); }
}

.brand {
  font-size: 16px;
  font-weight: 800;
  font-family: "Arial", -apple-system, sans-serif;
  letter-spacing: 0;
  background: linear-gradient(135deg, #ff4d4d, #d81b1b);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: 0 0 12px rgba(255, 77, 77, 0.4);
}
.meta {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 12px;
  border-radius: 100px;
  font-size: 11.5px;
  letter-spacing: .3px;
  color: var(--muted);
  background: rgba(255, 255, 255, .045);
  border: 1px solid rgba(255, 255, 255, .07);
}
.dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: #3ddc84;
  box-shadow: 0 0 8px #3ddc84;
  animation: pulse 2.2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50%      { opacity: .28; }
}

/* 按钮 */
.btns {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.btn {
  position: relative;
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 13px 14px;
  border-radius: 16px;
  overflow: hidden;
  text-decoration: none;
  color: var(--text);
  background: linear-gradient(135deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, .018));
  border: 1px solid rgba(255, 255, 255, .075);
  transition:
    transform .3s cubic-bezier(.2, .8, .2, 1),
    border-color .3s ease,
    background .3s ease,
    box-shadow .3s ease;
  animation: rise .65s cubic-bezier(.2, .8, .2, 1) both;
  cursor: pointer;
}

.btn:nth-child(1) { animation-delay: .10s; }
.btn:nth-child(2) { animation-delay: .19s; }
.btn:nth-child(3) { animation-delay: .28s; }
.btn:nth-child(4) { animation-delay: .37s; }
.btn:nth-child(5) { animation-delay: .46s; }
.btn:nth-child(6) { animation-delay: .55s; }

@keyframes rise {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}

.btn::before {
  content: '';
  position: absolute;
  top: -50%; bottom: -50%;
  left: -140%;
  width: 55%;
  pointer-events: none;
  transform: skewX(-20deg);
  background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .10), transparent);
  transition: left .65s cubic-bezier(.3, .7, .3, 1);
}
.btn:hover::before { left: 140%; }

.btn::after {
  content: '';
  position: absolute;
  left: 0; top: 50%;
  width: 3px; height: 0;
  border-radius: 0 3px 3px 0;
  transform: translateY(-50%);
  background: var(--accent);
  transition: height .3s ease;
}
.btn:hover::after { height: 58%; }

.btn:active { transform: translateY(0) scale(.995); }

.icon {
  flex: 0 0 auto;
  width: 42px; height: 42px;
  border-radius: 13px;
  display: grid;
  place-items: center;
  color: var(--accent);
  transition:
    transform .35s cubic-bezier(.2, .8, .2, 1),
    background .3s ease,
    box-shadow .3s ease;
}
.btn:hover .icon { 
  transform: scale(1.1) rotate(-8deg); /* 增加小幅旋转 */
  box-shadow: 0 0 15px var(--accent);
}
.text {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
}
.label {
  display: flex;
  align-items: center;
  flex-wrap: nowrap; /* 强制不换行 */
  gap: 6px;
  font-size: 15px;
  font-weight: 650;
  letter-spacing: .2px;
  white-space: nowrap; /* 防止标题折行 */
}
.desc {
  font-size: 11.5px;
  letter-spacing: .2px;
  color: rgba(214, 226, 255, 0.4);
  transition: color .3s ease;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis; /* 如果描述太长，自动显示省略号 */
}
.btn:hover .desc { color: rgba(214, 226, 255, .64); }

/* 标识标签 */
.tag { flex: 0 0 auto; padding: 2px 6px; border-radius: 5px; font-size: 9.5px; font-weight: 700; letter-spacing: .4px; line-height: 1.35; transform: translateY(-1px); transition: .3s ease; }
.tag-vpn { color: #ffca6b; background: rgba(255, 170, 40, .12); border: 1px solid rgba(255, 170, 40, .3); }
.btn:hover .tag-vpn { color: #ffd88f; background: rgba(255, 170, 40, .2); border-color: rgba(255, 170, 40, .5); }

.tag-paid { color: #ff6b6b; background: rgba(255, 107, 107, .12); border: 1px solid rgba(255, 107, 107, .3); }
.btn:hover .tag-paid { color: #ff9e9e; background: rgba(255, 107, 107, .2); border-color: rgba(255, 107, 107, .5); }

.tag-free { color: #3ddc84; background: rgba(61, 220, 132, .12); border: 1px solid rgba(61, 220, 132, .3); }
.btn:hover .tag-free { color: #70ffaa; background: rgba(61, 220, 132, .2); border-color: rgba(61, 220, 132, .5); }

.arrow {
  flex: 0 0 auto;
  width: 24px; height: 24px;
  display: grid;
  place-items: center;
  color: rgba(255, 255, 255, .26);
  transition: transform .3s cubic-bezier(.2, .8, .2, 1), color .3s ease;
}
.btn:hover .arrow {
  transform: translateX(4px);
  color: var(--accent);
}
/* 各按钮配色 */
.btn-suki { --accent: #3b9dff; }
.btn-suki .icon { background: rgba(59, 157, 255, .13); box-shadow: inset 0 0 0 1px rgba(59, 157, 255, .22); }
.btn-suki:hover { border-color: rgba(59, 157, 255, .42); background: linear-gradient(135deg, rgba(59, 157, 255, .10), rgba(255, 255, 255, .02)); box-shadow: 0 16px 36px -16px rgba(59, 157, 255, .85); }
.btn-suki:hover .icon { box-shadow: inset 0 0 0 1px rgba(59, 157, 255, .45), 0 0 18px -4px rgba(59, 157, 255, .7); }

.btn-baka { --accent: #ff7a45; }
.btn-baka .icon { background: rgba(255, 122, 69, .13); box-shadow: inset 0 0 0 1px rgba(255, 122, 69, .22); }
.btn-baka:hover { border-color: rgba(255, 122, 69, .42); background: linear-gradient(135deg, rgba(255, 122, 69, .10), rgba(255, 255, 255, .02)); box-shadow: 0 16px 36px -16px rgba(255, 100, 50, .8); }
.btn-baka:hover .icon { box-shadow: inset 0 0 0 1px rgba(255, 122, 69, .45), 0 0 18px -4px rgba(255, 122, 69, .7); }

.btn-env { --accent: #2dd4a7; }
.btn-env .icon { background: rgba(45, 212, 167, .13); box-shadow: inset 0 0 0 1px rgba(45, 212, 167, .22); }
.btn-env:hover { border-color: rgba(45, 212, 167, .42); background: linear-gradient(135deg, rgba(45, 212, 167, .10), rgba(255, 255, 255, .02)); box-shadow: 0 16px 36px -16px rgba(45, 212, 167, .85); }
.btn-env:hover .icon { box-shadow: inset 0 0 0 1px rgba(45, 212, 167, .45), 0 0 18px -4px rgba(45, 212, 167, .7); }

.btn-qq { --accent: #a855f7; }
.btn-qq .icon { background: rgba(168, 85, 247, .13); box-shadow: inset 0 0 0 1px rgba(168, 85, 247, .22); }
.btn-qq:hover { border-color: rgba(168, 85, 247, .42); background: linear-gradient(135deg, rgba(168, 85, 247, .10), rgba(255, 255, 255, .02)); box-shadow: 0 16px 36px -16px rgba(168, 85, 247, .85); }
.btn-qq:hover .icon { box-shadow: inset 0 0 0 1px rgba(168, 85, 247, .45), 0 0 18px -4px rgba(168, 85, 247, .7); }

.btn-tg { --accent: #29b6f6; }
.btn-tg .icon { background: rgba(41, 182, 246, .13); box-shadow: inset 0 0 0 1px rgba(41, 182, 246, .22); }
.btn-tg:hover { border-color: rgba(41, 182, 246, .42); background: linear-gradient(135deg, rgba(41, 182, 246, .10), rgba(255, 255, 255, .02)); box-shadow: 0 16px 36px -16px rgba(41, 182, 246, .85); }
.btn-tg:hover .icon { box-shadow: inset 0 0 0 1px rgba(41, 182, 246, .45), 0 0 18px -4px rgba(41, 182, 246, .7); }

.btn-key { --accent: #eab308; }
.btn-key .icon { background: rgba(234, 179, 8, .13); box-shadow: inset 0 0 0 1px rgba(234, 179, 8, .22); }
.btn-key:hover { border-color: rgba(234, 179, 8, .42); background: linear-gradient(135deg, rgba(234, 179, 8, .10), rgba(255, 255, 255, .02)); box-shadow: 0 16px 36px -16px rgba(234, 179, 8, .85); }
.btn-key:hover .icon { box-shadow: inset 0 0 0 1px rgba(234, 179, 8, .45), 0 0 18px -4px rgba(234, 179, 8, .7); }

/* 弹窗 */
..modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(6, 8, 15, 0.92); /* 改用纯深色遮罩，去掉模糊 */
  display: grid;
  place-items: center;
  padding: 24px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s ease;
}

.modal-overlay.active { opacity: 1; pointer-events: auto; }

.modal-content {
  width: 100%;
  max-width: 340px;
  padding: 26px 22px;
  border-radius: 24px;
  background: linear-gradient(160deg, #151d33, #0a0f1c);
  border: 1px solid rgba(255, 255, 255, .12);
  box-shadow: 0 30px 80px rgba(0, 0, 0, .85);
  text-align: center;
  transform: translateY(20px) scale(.95);
  transition: transform .35s cubic-bezier(.2, .8, .2, 1);
}
.modal-overlay.active .modal-content { transform: translateY(0) scale(1); }

.modal-title {
  font-size: 18px;
  font-weight: 800;
  margin-bottom: 6px;
  color: #fff;
}
.modal-sub {
  font-size: 12px;
  color: rgba(214, 226, 255, .5);
  margin-bottom: 20px;
}
.modal-input {
  width: 100%;
  padding: 12px 14px;
  border-radius: 12px;
  background: rgba(0, 0, 0, .3);
  border: 1px solid rgba(255, 255, 255, .15);
  color: #fff;
  font-size: 15px;
  font-family: inherit;
  text-align: center;
  outline: none;
  letter-spacing: 2px;
  transition: border-color .3s;
  margin-bottom: 10px;
}
.modal-input:focus { border-color: #3b9dff; }
.modal-err {
  color: #ff4d4d;
  font-size: 11.5px;
  min-height: 16px;
  margin-bottom: 12px;
}
.modal-btns {
  display: flex;
  gap: 10px;
}
.modal-btn {
  flex: 1;
  padding: 11px 0;
  border-radius: 12px;
  border: none;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: .25s;
}
.btn-cancel { background: rgba(255, 255, 255, .08); color: rgba(255, 255, 255, .7); }
.btn-cancel:hover { background: rgba(255, 255, 255, .15); color: #fff; }
.btn-confirm { background: linear-gradient(135deg, #3b9dff, #2f6bff); color: #fff; }
.btn-confirm:hover { opacity: .9; transform: scale(.98); }
/* 二维码弹窗专属 */
.qr-wrap {
  background: #fff;
  padding: 12px;
  border-radius: 16px;
  display: inline-block;
  margin-bottom: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,.3);
}
.qr-wrap img {
  display: block;
  width: 200px;
  height: 200px;
  object-fit: contain;
}

.foot {
  position: relative;
  z-index: 1;
  margin-top: 22px;
  text-align: center;
  font-size: 11px;
  letter-spacing: .4px;
  color: rgba(214, 226, 255, 0.35); /* 稍微提亮一点 */
}

@media (max-width: 400px) {
  .card-inner { padding: 30px 20px 20px; }
  h1 { font-size: 22px; }
  .logo { width: 58px; height: 58px; font-size: 22px; border-radius: 17px; }
  .btn { padding: 12px 12px; gap: 11px; }
  .icon { width: 38px; height: 38px; border-radius: 11px; }
  .label { font-size: 14px; }
  .tag { font-size: 9px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<script>
  // ---------- 鼠标跟随光斑 ----------
  (function () {
    const inner = document.querySelector('.card-inner');
    if (!inner) return;
    if (!window.matchMedia('(hover: hover)').matches) return;
    inner.addEventListener('pointermove', function (e) {
      const rect = inner.getBoundingClientRect();
      inner.style.setProperty('--mx', (e.clientX - rect.left) + 'px');
      inner.style.setProperty('--my', (e.clientY - rect.top) + 'px');
    });
  })();
  
  // ---------- 密码验证及加密逻辑 ----------
  (function () {
    // +2 ASCII 码偏移加密
    const ENCRYPTED_PASS = "J9274:";
    const SUKI_URL = "https://www.123684.com/s/YXhyVv-kcWsH";

    const btnSuki = document.getElementById('btnSuki');
    const passModal = document.getElementById('passModal');
    const passInput = document.getElementById('passInput');
    const passErr = document.getElementById('passErr');
    const passCancel = document.getElementById('passCancel');
    const passConfirm = document.getElementById('passConfirm');

    function encrypt(str) {
      return str.split('').map(c => String.fromCharCode(c.charCodeAt(0) + 2)).join('');
    }

    function openPassModal() {
      passInput.value = '';
      passErr.textContent = '';
      passModal.classList.add('active');
      setTimeout(() => passInput.focus(), 100);
    }

    function closePassModal() {
      passModal.classList.remove('active');
    }

    function verifyPass() {
      const input = passInput.value.trim();
      if (encrypt(input) === ENCRYPTED_PASS) {
        closePassModal();
        window.open(SUKI_URL, '_blank');
      } else {
        passErr.textContent = '密钥错误，请重新输入';
        passInput.value = '';
        passInput.focus();
      }
    }

    btnSuki.addEventListener('click', openPassModal);
    passCancel.addEventListener('click', closePassModal);
    passConfirm.addEventListener('click', verifyPass);
    passInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') verifyPass();
    });
    passModal.addEventListener('click', function(e) {
      if (e.target === passModal) closePassModal();
    });
  })();

  // ---------- 二维码弹窗逻辑 ----------
  (function () {
    const btnKey = document.getElementById('btnKey');
    const qrModal = document.getElementById('qrModal');
    const qrClose = document.getElementById('qrClose');

    btnKey.addEventListener('click', function() {
      qrModal.classList.add('active');
    });

    qrClose.addEventListener('click', function() {
      qrModal.classList.remove('active');
    });

    qrModal.addEventListener('click', function(e) {
      if (e.target === qrModal) qrModal.classList.remove('active');
    });
  })();
</script>
