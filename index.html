<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>满天星 - OnePlus</title>
<link rel="stylesheet" href="common.css">
<style>
.card-inner { padding: 22px 18px 18px; }

/* 公告栏 */
.notice-bar {
  position: relative;
  z-index: 11;
  display: flex;
  align-items: center;
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 10px;
  padding: 6px 10px;
  margin-bottom: 16px;
  font-size: 11.5px;
  color: #ffca6b;
  overflow: hidden;
}
.notice-icon { flex-shrink: 0; margin-right: 6px; }
.notice-content { flex: 1; overflow: hidden; }
.notice-track {
  display: inline-flex;
  white-space: nowrap;
  animation: marquee 15s linear infinite;
}
/* 注意：必须复制两份且等宽，才能无缝循环 */
.notice-track span { padding-right: 30px; }
.notice-bar:hover .notice-track { animation-play-state: paused; }
@keyframes marquee {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

/* 头部 */
.head { position: relative; z-index: 11; text-align: center; margin-bottom: 16px; }

.logo {
  position: relative;
  width: 50px; height: 50px;
  margin: 0 auto 10px;
  border-radius: 15px;
  display: grid; place-items: center;
  font-size: 20px;
  font-weight: 900;
  color: #fff;
  background: linear-gradient(145deg, #ff4d4d, #ff3b30 40%, #d81b1b);
  z-index: 1;
}
.logo::before {
  content: '';
  position: absolute; inset: -3px;
  border-radius: 17px;
  background: linear-gradient(145deg, #ff4d4d, #ff3b30);
  filter: blur(8px);
  z-index: -1;
  animation: logoPulse 2s infinite alternate;
}
@keyframes logoPulse {
  0% { opacity: .3; transform: scale(.95); }
  100% { opacity: .8; transform: scale(1.05); }
}
.logo::after {
  content: '';
  position: absolute; inset: 0;
  border-radius: inherit;
  background: linear-gradient(160deg, rgba(255,255,255,.34), transparent 46%);
  pointer-events: none;
}

h1 {
  margin-bottom: 6px;
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 1px;
  background: linear-gradient(100deg, #ffffff 10%, #b9ccff 55%, #d9b6ff 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 6px;
}
.brand {
  font-size: 13px;
  font-weight: 800;
  font-family: "Arial", sans-serif;
  background: linear-gradient(135deg, #ff4d4d, #d81b1b);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.meta-group {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  margin-bottom: 16px;
}
.meta {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 100px;
  font-size: 10.5px;
  color: var(--muted);
  background: rgba(255,255,255,.045);
  border: 1px solid rgba(255,255,255,.07);
}
.dot {
  width: 4px; height: 4px;
  border-radius: 50%;
  background: #3ddc84;
  box-shadow: 0 0 6px #3ddc84;
  animation: dotPulse 2s infinite alternate;
}
@keyframes dotPulse {
  0% { opacity: .5; box-shadow: 0 0 2px #3ddc84; transform: scale(.8); }
  100% { opacity: 1; box-shadow: 0 0 10px #3ddc84, 0 0 15px rgba(61,220,132,.4); transform: scale(1.2); }
}
.quote { font-size: 11px; color: #a0b0d0; font-style: italic; opacity: .8; }

/* 按钮 */
.btns {
  position: relative;
  z-index: 11;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.btn {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 12px;
  overflow: hidden;
  text-decoration: none;
  color: var(--text);
  background: linear-gradient(135deg, rgba(255,255,255,.05), rgba(255,255,255,.018));
  border: 1px solid rgba(255,255,255,.075);
  transition: transform .2s, border-color .2s, background .2s;
  cursor: pointer;
}
.btn::after {
  content: '';
  position: absolute;
  left: 0; top: 50%;
  width: 2px; height: 0;
  border-radius: 0 2px 2px 0;
  transform: translateY(-50%);
  background: var(--accent);
  transition: height .2s ease;
}
.btn:hover::after { height: 50%; }
.btn:active { transform: translateY(0) scale(.98); }

.icon {
  flex: 0 0 auto;
  width: 34px; height: 34px;
  border-radius: 10px;
  display: grid; place-items: center;
  color: var(--accent);
}
.icon svg { width: 18px; height: 18px; }

.text { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 1px; }
.label { display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 650; white-space: nowrap; }
.desc { font-size: 10.5px; color: rgba(214,226,255,.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.tag { padding: 1px 4px; border-radius: 4px; font-size: 8.5px; font-weight: 700; }
.tag-vpn { color: #ffca6b; background: rgba(255,170,40,.12); border: 1px solid rgba(255,170,40,.3); }
.tag-paid { color: #ff6b6b; background: rgba(255,107,107,.12); border: 1px solid rgba(255,107,107,.3); }
.tag-free { color: #3ddc84; background: rgba(61,220,132,.12); border: 1px solid rgba(61,220,132,.3); }
/* 新增：更新徽标样式 */
.update-badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 1px 5px;
  border-radius: 4px;
  font-size: 8.5px;
  font-weight: 700;
  color: #00e5ff; /* 亮青色 */
  background: rgba(0, 229, 255, .12);
  border: 1px solid rgba(0, 229, 255, .3);
  margin-left: 4px;
  animation: badgePulse 2s infinite alternate;
}
/* 徽标里的小闪烁点 */
.update-dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #00e5ff;
  box-shadow: 0 0 4px #00e5ff;
}

@keyframes badgePulse {
  0% { opacity: 0.7; transform: scale(0.98); }
  100% { opacity: 1; transform: scale(1.02); box-shadow: 0 0 8px rgba(0, 229, 255, 0.3); }
}

.arrow { width: 18px; height: 18px; display: grid; place-items: center; color: rgba(255,255,255,.26); }
.arrow svg { width: 14px; height: 14px; }

.btn-suki { --accent: #3b9dff; } .btn-suki .icon { background: rgba(59,157,255,.13); }
.btn-suki:hover { border-color: rgba(59,157,255,.42); background: linear-gradient(135deg, rgba(59,157,255,.1), rgba(255,255,255,.02)); }
.btn-baka { --accent: #ff7a45; } .btn-baka .icon { background: rgba(255,122,69,.13); }
.btn-baka:hover { border-color: rgba(255,122,69,.42); background: linear-gradient(135deg, rgba(255,122,69,.1), rgba(255,255,255,.02)); }

.btn-env:hover { border-color: rgba(45,212,167,.42); background: linear-gradient(135deg, rgba(45,212,167,.1), rgba(255,255,255,.02)); }
.btn-qq { --accent: #a855f7; } .btn-qq .icon { background: rgba(168,85,247,.13); }
.btn-qq:hover { border-color: rgba(168,85,247,.42); background: linear-gradient(135deg, rgba(168,85,247,.1), rgba(255,255,255,.02)); }
.btn-tg { --accent: #29b6f6; } .btn-tg .icon { background: rgba(41,182,246,.13); }
.btn-tg:hover { border-color: rgba(41,182,246,.42); background: linear-gradient(135deg, rgba(41,182,246,.1), rgba(255,255,255,.02)); }
.btn-key { --accent: #eab308; } .btn-key .icon { background: rgba(234,179,8,.13); }
.btn-key:hover { border-color: rgba(234,179,8,.42); background: linear-gradient(135deg, rgba(234,179,8,.1), rgba(255,255,255,.02)); }

.foot {

  font-size: 10px;
  color: rgba(214,226,255,.35);
  display: flex;
  flex-direction: column;
  gap: 4px;
}
</style>
