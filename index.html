<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>满天星 - OnePlus</title>
<style>
@property --angle {
  syntax: '<angle>';
  initial-value: 0deg;
  inherits: true;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --angle: 0deg;
  --text: #eef2ff;
  --muted: rgba(214, 226, 255, .46);
}

html, body { height: 100%; }

body {
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 28px 18px;
  font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  color: var(--text);
  background: #04060a;
  background-image: radial-gradient(circle at 50% 0%, #0d1425 0%, #04060a 100%);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* 满天星背景 */
.stars {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: 
    radial-gradient(1.5px 1.5px at 20px 30px, #fff, rgba(0,0,0,0)),
    radial-gradient(1px 1px at 40px 70px, #fff, rgba(0,0,0,0)),
    radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
    radial-gradient(1.5px 1.5px at 160px 120px, #fff, rgba(0,0,0,0)),
    radial-gradient(1px 1px at 230px 80px, #fff, rgba(0,0,0,0)),
    radial-gradient(2px 2px at 280px 160px, #fff, rgba(0,0,0,0));
  background-repeat: repeat;
  background-size: 300px 200px;
  animation: twinkle 4s infinite alternate;
}
@keyframes twinkle {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}
.orb {
  position: fixed;
  z-index: 0;
  border-radius: 50%;
  filter: blur(120px);
  pointer-events: none;
  opacity: .15;
}
.orb-1 { width: 440px; height: 440px; background: #2f6bff; top: -170px; left: -130px; }
.orb-2 { width: 420px; height: 420px; background: #8b3bff; bottom: -190px; right: -130px; }
.orb-3 { width: 300px; height: 300px; background: #ff3b6b; top: 56%; left: 62%; opacity: .08; }

/* 卡片 */
.card {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 432px;
  padding: 1.5px;
  border-radius: 28px;
  background: conic-gradient(from var(--angle),
    #2f6bff, #8b5cf6 22%, #ff4d6d 42%, #ff9d3d 58%, #2f6bff 78%, #2f6bff 100%);
  box-shadow: 0 34px 90px -28px rgba(0, 0, 0, .92), 0 0 80px -32px rgba(90, 120, 255, .6);
  animation: cardIn .85s cubic-bezier(.2, .8, .2, 1) both, spin 9s linear infinite;
}

@keyframes spin { to { --angle: 360deg; } }
@keyframes cardIn {
  from { opacity: 0; transform: translateY(22px) scale(.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.card-inner {
  position: relative;
  isolation: isolate;
  padding: 34px 22px 22px;
  border-radius: 26.5px;
  overflow: hidden;
  background: rgba(13, 18, 30, 0.85);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
}

.spotlight {
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0;
  transition: opacity .35s ease;
  background: radial-gradient(340px circle at var(--mx, 50%) var(--my, 0%), rgba(120, 160, 255, .10), transparent 62%);
}
.card:hover .spotlight { opacity: 1; }

/* 头部 */
.head {
  position: relative;
  z-index: 1;
  text-align: center;
  margin-bottom: 26px;
}
.logo {
  position: relative;
  width: 66px; height: 66px;
  margin: 0 auto 18px;
  border-radius: 20px;
  display: grid;
  place-items: center;
  overflow: hidden;
  font-size: 25px;
  font-weight: 900;
  letter-spacing: -.5px;
  color: #fff;
  background: linear-gradient(145deg, #ff4d4d, #ff3b30 40%, #d81b1b);
  box-shadow: 0 14px 34px -8px rgba(255, 60, 60, .55), inset 0 1px 0 rgba(255, 255, 255, .45);
}
.logo::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(160deg, rgba(255, 255, 255, .34), transparent 46%);
  pointer-events: none;
}

h1 {
  margin-bottom: 10px;
  font-size: 26px;
  font-weight: 900;
  letter-spacing: 1px;
  background: linear-gradient(100deg, #ffffff 10%, #b9ccff 55%, #d9b6ff 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 8px;
  animation: titlePulse 3s infinite alternate;
}

@keyframes titlePulse {
  from { text-shadow: 0 0 10px rgba(185, 204, 255, 0.2); }
  to { text-shadow: 0 0 25px rgba(185, 204, 255, 0.7), 0 0 35px rgba(217, 182, 255, 0.4); }
}

.brand {
  font-size: 16px;
  font-weight: 800;
  font-family: "Arial", -apple-system, sans-serif;
  letter-spacing: 0;
  background: linear-gradient(135deg, #ff4d4d, #d81b1b);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: 0 0 12px rgba(255, 77, 77, 0.4);
}
.meta {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 12px;
  border-radius: 100px;
  font-size: 11.5px;
  letter-spacing: .3px;
  color: var(--muted);
  background: rgba(255, 255, 255, .045);
  border: 1px solid rgba(255, 255, 255, .07);
}

.dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: #3ddc84;
  box-shadow: 0 0 8px #3ddc84;
  animation: pulse 2.2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50%      { opacity: .28; }
}

/* 按钮列表 */
.btns {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.btn {
  position: relative;
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 11px 14px;
  border-radius: 16px;
  overflow: hidden;
  text-decoration: none;
  color: var(--text);
  background: linear-gradient(135deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, .018));
  border: 1px solid rgba(255, 255, 255, .075);
  transition: transform .3s cubic-bezier(.2, .8, .2, 1), border-color .3s ease, background .3s ease, box-shadow .3s ease;
  animation: rise .65s cubic-bezier(.2, .8, .2, 1) both;
  cursor: pointer;
}

.btn:nth-child(1) { animation-delay: .10s; }
.btn:nth-child(2) { animation-delay: .19s; }
.btn:nth-child(3) { animation-delay: .28s; }
.btn:nth-child(4) { animation-delay: .37s; }
.btn:nth-child(5) { animation-delay: .46s; }
.btn:nth-child(6) { animation-delay: .55s; }

@keyframes rise {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}

.btn::before {
  content: '';
  position: absolute;
  top: -50%; bottom: -50%;
  left: -140%;
  width: 55%;
  pointer-events: none;
  transform: skewX(-20deg);
  background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .10), transparent);
  transition: left .65s cubic-bezier(.3, .7, .3, 1);
}
.btn:hover::before { left: 140%; }

.btn::after {
  content: '';
  position: absolute;
  left: 0; top: 50%;
  width: 3px; height: 0;
  border-radius: 0 3px 3px 0;
  transform: translateY(-50%);
  background: var(--accent);
  transition: height .3s ease;
}
.btn:hover::after { height: 58%; }
.btn:active { transform: translateY(0) scale(.995); }

.icon {
  flex: 0 0 auto;
  width: 42px; height: 42px;
  border-radius: 13px;
  display: grid;
  place-items: center;
  color: var(--accent);
  transition: transform .35s cubic-bezier(.2, .8, .2, 1), background .3s ease, box-shadow .3s ease;
}
.btn:hover .icon { 
  transform: scale(1.1) rotate(-8deg); 
  box-shadow: 0 0 15px var(--accent);
}

.text {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
}
.label {
  display: flex;
  align-items: center;
  flex-wrap: nowrap;
  gap: 6px;
  font-size: 15px;
  font-weight: 650;
  letter-spacing: .2px;
  white-space: nowrap;
}
.desc {
font-size: 11.5px;
  letter-spacing: .2px;
  color: rgba(214, 226, 255, 0.6);
  transition: color .3s ease;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.tag { flex: 0 0 auto; padding: 2px 6px; border-radius: 5px; font-size: 9.5px; font-weight: 700; letter-spacing: .4px; line-height: 1.35; transform: translateY(-1px); transition: .3s ease; }
.tag-vpn { color: #ffca6b; background: rgba(255, 170, 40, .12); border: 1px solid rgba(255, 170, 40, .3); }
.tag-paid { color: #ff6b6b; background: rgba(255, 107, 107, .12); border: 1px solid rgba(255, 107, 107, .3); }
.tag-free { color: #3ddc84; background: rgba(61, 220, 132, .12); border: 1px solid rgba(61, 220, 132, .3); }

.arrow {
  flex: 0 0 auto;
  width: 24px; height: 24px;
  display: grid;
  place-items: center;
  color: rgba(255, 255, 255, .26);
  transition: transform .3s cubic-bezier(.2, .8, .2, 1), color .3s ease;
}
.btn:hover .arrow {
  transform: translateX(4px);
  color: var(--accent);
}

.btn-suki { --accent: #3b9dff; }
.btn-suki .icon { background: rgba(59, 157, 255, .13); box-shadow: inset 0 0 0 1px rgba(59, 157, 255, .22); }
.btn-suki:hover { border-color: rgba(59, 157, 255, .42); background: linear-gradient(135deg, rgba(59, 157, 255, .10), rgba(255, 255, 255, .02)); box-shadow: 0 16px 36px -16px rgba(59, 157, 255, .85); }
.btn-baka { --accent: #ff7a45; }
.btn-baka .icon { background: rgba(255, 122, 69, .13); box-shadow: inset 0 0 0 1px rgba(255, 122, 69, .22); }
.btn-baka:hover { border-color: rgba(255, 122, 69, .42); background: linear-gradient(135deg, rgba(255, 122, 69, .10), rgba(255, 255, 255, .02)); box-shadow: 0 16px 36px -16px rgba(255, 100, 50, .8); }

.btn-env { --accent: #2dd4a7; }
.btn-env .icon { background: rgba(45, 212, 167, .13); box-shadow: inset 0 0 0 1px rgba(45, 212, 167, .22); }
.btn-env:hover { border-color: rgba(45, 212, 167, .42); background: linear-gradient(135deg, rgba(45, 212, 167, .10), rgba(255, 255, 255, .02)); box-shadow: 0 16px 36px -16px rgba(45, 212, 167, .85); }

.btn-qq { --accent: #a855f7; }
.btn-qq .icon { background: rgba(168, 85, 247, .13); box-shadow: inset 0 0 0 1px rgba(168, 85, 247, .22); }
.btn-qq:hover { border-color: rgba(168, 85, 247, .42); background: linear-gradient(135deg, rgba(168, 85, 247, .10), rgba(255, 255, 255, .02)); box-shadow: 0 16px 36px -16px rgba(168, 85, 247, .85); }

.btn-tg { --accent: #29b6f6; }
.btn-tg .icon { background: rgba(41, 182, 246, .13); box-shadow: inset 0 0 0 1px rgba(41, 182, 246, .22); }
.btn-tg:hover { border-color: rgba(41, 182, 246, .42); background: linear-gradient(135deg, rgba(41, 182, 246, .10), rgba(255, 255, 255, .02)); box-shadow: 0 16px 36px -16px rgba(41, 182, 246, .85); }

.btn-key { --accent: #eab308; }
.btn-key .icon { background: rgba(234, 179, 8, .13); box-shadow: inset 0 0 0 1px rgba(234, 179, 8, .22); }
.btn-key:hover { border-color: rgba(234, 179, 8, .42); background: linear-gradient(135deg, rgba(234, 179, 8, .10), rgba(255, 255, 255, .02)); box-shadow: 0 16px 36px -16px rgba(234, 179, 8, .85); }
.foot {
  position: relative;
  z-index: 1;
  margin-top: 22px;
  text-align: center;
  font-size: 11px;
  letter-spacing: .4px;
  color: rgba(214, 226, 255, .35);
}

/* ========== 音乐控制面板（可拖拽版） ========== */
.music-widget {
  position: fixed;
  top: 20px;
  left: 20px;
  z-index: 9999;
  display: flex;
  align-items: center;
  font-family: system-ui, sans-serif;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none; /* 防止拖动时触发浏览器滚动 */
}

/* 展开的玻璃面板 */
.music-panel {
  position: absolute;
  left: 60px;
  background: rgba(13, 18, 30, 0.7);
  backdrop-filter: blur(25px) saturate(150%);
  -webkit-backdrop-filter: blur(25px) saturate(150%);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 100px;
  display: flex;
  align-items: center;
  padding: 6px 16px 6px 14px;
  gap: 12px;
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.2);
  opacity: 0;
  pointer-events: none;
  transform: translateX(-15px) scale(0.95);
  transform-origin: left center;
  transition: opacity 0.4s, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  white-space: nowrap;
}

.music-widget.active .music-panel {
  opacity: 1;
  pointer-events: auto;
  transform: translateX(0) scale(1);
}

/* 歌曲名 */
.music-info {
  font-size: 12px;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.85);
  max-width: 85px;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-right: 6px;
  border-right: 1px solid rgba(255, 255, 255, 0.15);
  padding-right: 12px;
  text-shadow: 0 1px 3px rgba(0,0,0,0.5);
}
.music-controls {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* 上/下一首按钮 */
.music-controls button {
  background: none;
  border: none;
  color: rgba(255, 255, 255, 0.6);
  cursor: pointer;
  padding: 6px;
  display: grid;
  place-items: center;
  transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  border-radius: 50%;
}

.music-controls button:hover {
  color: #fff;
  background: rgba(255, 255, 255, 0.1);
  transform: scale(1.15);
}

/* 主播放按钮 */
.play-btn {
  color: #fff !important;
  background: linear-gradient(135deg, #3b9dff, #2f6bff) !important;
  border-radius: 50%;
  width: 34px;
  height: 34px;
  box-shadow: 0 4px 15px rgba(59, 157, 255, 0.4);
}

.play-btn:hover {
  transform: scale(1.1) !important;
  box-shadow: 0 6px 20px rgba(59, 157, 255, 0.6) !important;
}

/* 悬浮球容器（处理拖拽） */
.music-ball-wrap {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  cursor: grab;
  position: relative;
  animation: float-btn 4s ease-in-out infinite; /* 上下浮动动画在外层 */
}
.music-ball-wrap:active {
  cursor: grabbing;
}

/* 黑胶唱片本体（处理旋转） */
.music-ball {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: linear-gradient(145deg, rgba(30, 40, 60, 0.95), rgba(10, 15, 25, 0.98));
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  display: grid;
  place-items: center;
  color: rgba(255, 255, 255, 0.85);
  box-shadow: 
    0 10px 25px rgba(0, 0, 0, 0.6), 
    inset 0 2px 5px rgba(255, 255, 255, 0.15),
    inset 0 -2px 10px rgba(0, 0, 0, 0.5);
  transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
  position: relative;
}
/* 唱片纹路 */
.music-ball::before {
  content: '';
  position: absolute;
  inset: 4px;
  border-radius: 50%;
  border: 1px dashed rgba(255, 255, 255, 0.15);
  pointer-events: none;
}

.music-ball-wrap:hover .music-ball {
  background: linear-gradient(145deg, rgba(45, 60, 90, 0.95), rgba(15, 20, 35, 0.98));
  color: #fff;
  border-color: rgba(59, 157, 255, 0.5);
}

/* 播放时的特效 */
.music-widget.playing .music-ball-wrap {
  animation: none; /* 播放时停止上下浮动 */
}
.music-widget.playing .music-ball {
  animation: spin-music 8s linear infinite; /* 开始旋转 */
  color: #3b9dff;
  border-color: rgba(59, 157, 255, 0.6);
  box-shadow: 
    0 10px 25px rgba(0, 0, 0, 0.6), 
    0 0 25px rgba(59, 157, 255, 0.4),
    inset 0 0 10px rgba(59, 157, 255, 0.2);
}
.music-widget.playing .music-ball svg {
  animation: spin-reverse 8s linear infinite; /* 反向旋转图标 */
}

@keyframes spin-music { 100% { transform: rotate(360deg); } }
@keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
@keyframes float-btn {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}
@media (max-width: 400px) {
  .card-inner { padding: 30px 20px 20px; }
  h1 { font-size: 22px; }
  .logo { width: 58px; height: 58px; font-size: 22px; border-radius: 17px; }
  .btn { padding: 12px 12px; gap: 11px; }
  .icon { width: 38px; height: 38px; border-radius: 11px; }
  .label { font-size: 14px; }
  .tag { font-size: 9px; }
}
</style>
</head>

  <!-- ========== 音乐控制面板 ========== -->
  <audio id="bgMusic" loop></audio>

  <div class="music-widget" id="musicWidget" style="left: 20px; top: 20px;">
    <div class="music-panel" id="musicPanel">
      <div class="music-info">
        <span id="musicName">准备就绪</span>
      </div>
      <div class="music-controls">
        <button onclick="prevSong(event)" title="上一首">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>
        </button>
        <button onclick="togglePlay(event)" class="play-btn" id="playBtn" title="播放/暂停">
          <svg id="iconPlay" viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          <svg id="iconPause" viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" style="display:none;"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
        </button>
        <button onclick="nextSong(event)" title="下一首">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
        </button>
      </div>
    </div>
<!-- 拖拽区域（包含内部图标） -->
    <div class="music-ball-wrap" id="musicBallWrap">
      <div class="music-ball" id="musicBall">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
      </div>
    </div>
  </div>

<script>
  // 鼠标跟随光斑逻辑
  (function () {
    const inner = document.querySelector('.card-inner');
    if (!inner) return;
    if (!window.matchMedia('(hover: hover)').matches) return;
    inner.addEventListener('pointermove', function (e) {
      const rect = inner.getBoundingClientRect();
      inner.style.setProperty('--mx', (e.clientX - rect.left) + 'px');
      inner.style.setProperty('--my', (e.clientY - rect.top) + 'px');
    });
  })();

  // ========== 音乐智能加载逻辑 ==========
  const bgMusic = document.getElementById('bgMusic');
  const musicWidget = document.getElementById('musicWidget');
  const musicName = document.getElementById('musicName');
  const iconPlay = document.getElementById('iconPlay');
  const iconPause = document.getElementById('iconPause');
  const musicPanel = document.getElementById('musicPanel');

  let currentIndex = 0;
  let isPlaying = false;
  let playlist = [{ name: "默认音乐", src: "music1.mp3" }];

  fetch('music.txt')
    .then(response => response.text())
    .then(text => {
      const lines = text.split('\n').filter(line => line.trim() !== '');
      if (lines.length > 0) {
        playlist = lines.map(line => {
          const parts = line.split('|');
          if (parts.length >= 2) {
            return { name: parts[0].trim(), src: parts[1].trim() };
          } else {
            return { name: parts[0].trim(), src: parts[0].trim() };
          }
        });
      }
    })
    .catch(err => console.log("未找到 music.txt，使用默认单曲。"));
 // 阻止面板内的点击事件冒泡，避免点击面板时触发拖拽
  musicPanel.addEventListener('pointerdown', e => e.stopPropagation());

  function loadSong(index) {
    currentIndex = index;
    const song = playlist[currentIndex];
    bgMusic.src = song.src;
    musicName.innerText = song.name;
    if (isPlaying) {
      bgMusic.play().catch(e => console.log(e));
    }
  }

  function togglePlay(e) {
    if(e) e.stopPropagation(); // 阻止冒泡
    if (isPlaying) {
      bgMusic.pause();
      musicWidget.classList.remove('playing');
      iconPlay.style.display = 'block';
      iconPause.style.display = 'none';
    } else {
      if (!bgMusic.src) loadSong(0);
      bgMusic.play().catch(e => console.log("等待交互..."));
      musicWidget.classList.add('playing');
      iconPlay.style.display = 'none';
      iconPause.style.display = 'block';
    }
    isPlaying = !isPlaying;
  }

  function nextSong(e) {
    if(e) e.stopPropagation();
    currentIndex = (currentIndex + 1) % playlist.length;
    loadSong(currentIndex);
    if (!isPlaying) togglePlay();
  }

  function prevSong(e) {
    if(e) e.stopPropagation();
    currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
    loadSong(currentIndex);
    if (!isPlaying) togglePlay();
  }

  bgMusic.addEventListener('ended', () => nextSong());

  // ========== 拖拽与点击逻辑 ==========
  const ballWrap = document.getElementById('musicBallWrap');
  let isDragging = false;
  let hasMoved = false;
  let startX, startY, initialLeft, initialTop;

  ballWrap.addEventListener('pointerdown', (e) => {
    // 阻止浏览器默认的图片/文字拖拽行为
    e.preventDefault(); 
    isDragging = true;
    hasMoved = false;
    
    // 获取起始坐标
    startX = e.clientX;
    startY = e.clientY;
    
    // 获取元素当前的位置
    const rect = musicWidget.getBoundingClientRect();
    initialLeft = rect.left;
    initialTop = rect.top;

    // 添加捕获指针，防止鼠标移出元素后丢失事件
    ballWrap.setPointerCapture(e.pointerId);
  });

  ballWrap.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    
    const deltaX = e.clientX - startX;
    const deltaY = e.clientY - startY;

    // 判断移动距离，超过 5px 认为是在拖拽而不是点击
    if (Math.abs(deltaX) > 5 || Math.abs(deltaY) > 5) {
      hasMoved = true;
    }
 // 计算新位置
    let newLeft = initialLeft + deltaX;
    let newTop = initialTop + deltaY;

    // 屏幕边界限制
    const maxLeft = window.innerWidth - rect.width;
    const maxTop = window.innerHeight - rect.height;
    newLeft = Math.max(0, Math.min(newLeft, maxLeft));
    newTop = Math.max(0, Math.min(newTop, maxTop));

    // 更新位置
    musicWidget.style.left = newLeft + 'px';
    musicWidget.style.top = newTop + 'px';
    
    // 拖动时如果面板是展开的，把它收起来
    if (hasMoved && musicWidget.classList.contains('active')) {
      musicWidget.classList.remove('active');
    }
  });

  ballWrap.addEventListener('pointerup', (e) => {
    if (!isDragging) return;
    isDragging = false;
    ballWrap.releasePointerCapture(e.pointerId);

    // 如果没有移动（只是点击），则切换面板
    if (!hasMoved) {
      musicWidget.classList.toggle('active');
    }
  });

  // 处理拖拽取消
  ballWrap.addEventListener('pointercancel', (e) => {
    isDragging = false;
    ballWrap.releasePointerCapture(e.pointerId);
  });

  // ========== 自动播放逻辑 ==========
  let autoPlayTriggered = false;
  document.addEventListener('pointerdown', function() {
    if (!isPlaying && !autoPlayTriggered && !isDragging) {
      autoPlayTriggered = true;
      if (!bgMusic.src) {
        loadSong(0);
      }
      togglePlay();
      musicWidget.classList.add('active');
    }
  }, { once: true });
</script>
