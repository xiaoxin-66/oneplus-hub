<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>满天星 - OnePlus</title>
<link rel="stylesheet" href="common.css">
<style>
.card-inner { padding: 20px 16px 18px; }
.notice-bar { position: relative; z-index: 11; display: flex; align-items: center; background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.1); border-radius: 10px; padding: 8px 10px; margin-bottom: 16px; font-size: 11px; color: #ffca6b; overflow: hidden; }
.notice-icon { flex-shrink: 0; margin-right: 6px; }
.notice-content { flex: 1; overflow: hidden; }
.notice-track { display: inline-flex; white-space: nowrap; animation: marquee 15s linear infinite; }
.notice-track span { padding-right: 30px; }
@keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
.head { position: relative; z-index: 11; text-align: center; margin-bottom: 18px; }
.logo { position: relative; width: 50px; height: 50px; margin: 0 auto 10px; border-radius: 14px; display: grid; place-items: center; font-size: 22px; font-weight: 900; color: #fff; background: linear-gradient(145deg, #ff5e5e, #ff3b30 40%, #c91414); box-shadow: inset 0 2px 4px rgba(255,255,255,0.4), 0 6px 15px rgba(255,59,48,0.3); z-index: 1; }
.logo::before { content: ''; position: absolute; inset: -4px; border-radius: 18px; background: linear-gradient(145deg, #ff4d4d, #ff3b30); filter: blur(10px); z-index: -1; animation: logoPulse 2s infinite alternate; }
@keyframes logoPulse { 0% { opacity: .2; transform: scale(.9); } 100% { opacity: .7; transform: scale(1.05); } }
h1 { margin-bottom: 6px; font-size: 20px; font-weight: 900; letter-spacing: 1px; background: linear-gradient(100deg, #ffffff 0%, #d4e4ff 50%, #e6d4ff 100%); -webkit-background-clip: text; background-clip: text; color: transparent; display: flex; align-items: baseline; justify-content: center; gap: 6px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8)) drop-shadow(0 0 10px rgba(160, 200, 255, 0.5)); }
.brand { font-size: 12px; font-weight: 800; font-family: "Arial", sans-serif; background: linear-gradient(135deg, #ff6b6b, #ff3b30); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8)) drop-shadow(0 0 8px rgba(255, 59, 48, 0.4)); }
.meta-group { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 16px; }
.meta { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 100px; font-size: 10px; color: #fff; background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.1); }
.dot { width: 4px; height: 4px; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 6px #3ddc84; animation: dotPulse 2s infinite alternate; }
@keyframes dotPulse { 0% { opacity: .5; box-shadow: 0 0 2px #3ddc84; transform: scale(.8); } 100% { opacity: 1; box-shadow: 0 0 10px #3ddc84; transform: scale(1.2); } }
.quote { font-size: 10.5px; color: #a0b0d0; font-style: italic; opacity: .9; text-shadow: 0 1px 4px #000; }

.btns { position: relative; z-index: 11; display: flex; flex-direction: column; gap: 10px; }
.btn { position: relative; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; overflow: hidden; text-decoration: none; color: var(--text); background: rgba(0, 0, 0, 0.25); border: 1px solid rgba(255,255,255,.08); transition: transform 0.2s; cursor: pointer; }
.btn:hover { background: rgba(0, 0, 0, 0.4); border-color: rgba(255,255,255,.15); }
.btn:active { transform: scale(0.96); background: rgba(255,255,255,0.08); }

.icon { flex: 0 0 34px; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--accent); }
.icon svg { width: 18px; height: 18px; }
.text { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 3px; }
.row-1 { display: flex; align-items: center; gap: 6px; }
.row-2 { display: flex; align-items: center; gap: 6px; }
.row-3 { font-size: 10.5px; color: rgba(214,226,255,.5); }
.label { font-size: 13.5px; font-weight: 700; white-space: nowrap; }

/* ================= 美化标识（精致胶囊） ================= */
.tag { 
  display: inline-flex; 
  align-items: center; 
  padding: 2px 8px; 
  border-radius: 100px; 
  font-size: 9.5px; 
  font-weight: 800; 
  line-height: 1;
  letter-spacing: 0.5px;
  transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
}
.tag-vpn { color: #ffca6b; background: linear-gradient(135deg, rgba(255,170,40,.2), rgba(255,170,40,.05)); border: 1px solid rgba(255,170,40,.35); }
.tag-paid { color: #ff6b6b; background: linear-gradient(135deg, rgba(255,107,107,.2), rgba(255,107,107,.05)); border: 1px solid rgba(255,107,107,.35); }
.tag-free { color: #3ddc84; background: linear-gradient(135deg, rgba(61,220,132,.2), rgba(61,220,132,.05)); border: 1px solid rgba(61,220,132,.35); }

/* 已解锁状态：发光胶囊 */
.tag-paid.unlocked { 
  color: #3ddc84; 
  background: linear-gradient(135deg, rgba(61,220,132,.25), rgba(61,220,132,.08)); 
  border: 1px solid rgba(61,220,132,.5); 
  box-shadow: inset 0 1px 2px rgba(255,255,255,0.2), 0 0 10px rgba(61,220,132,.2);
  animation: capsuleGlow 2s infinite alternate;
}
@keyframes capsuleGlow {
  0% { box-shadow: inset 0 1px 2px rgba(255,255,255,0.2), 0 0 5px rgba(61,220,132,.2); }
  100% { box-shadow: inset 0 1px 2px rgba(255,255,255,0.3), 0 0 15px rgba(61,220,132,.5); }
}

/* 更新提示徽标 */
.update-badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 6px; border-radius: 6px; font-size: 9px; font-weight: 700; color: #00e5ff; background: rgba(0,229,255,.1); border: 1px solid rgba(0, 229, 255, 0.25); animation: floatBadge 2.5s infinite; }
.update-dot { width: 4px; height: 4px; border-radius: 50%; background: #00e5ff; box-shadow: 0 0 5px #00e5ff; }
@keyframes floatBadge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }

.arrow { width: 14px; height: 14px; display: grid; place-items: center; color: rgba(255,255,255,.2); flex-shrink: 0; margin-left: 4px; }
.btn-suki { --accent: #3b9dff; } .btn-suki .icon { background: rgba(59,157,255,.15); }
.btn-baka { --accent: #ff7a45; } .btn-baka .icon { background: rgba(255,122,69,.15); }
.btn-env { --accent: #2dd4a7; } .btn-env .icon { background: rgba(45,212,167,.15); }
.btn-qq { --accent: #a855f7; } .btn-qq .icon { background: rgba(168,85,247,.15); }
.btn-tg { --accent: #29b6f6; } .btn-tg .icon { background: rgba(41,182,246,.15); }
.btn-key { --accent: #eab308; } .btn-key .icon { background: rgba(234,179,8,.15); }
.foot { position: relative; z-index: 11; margin-top: 16px; text-align: center; font-size: 10px; color: rgba(214,226,255,.4); }
</style>
</head>
<body>

<script src="common.js"></script>
<script>
  const NOTICES = ["最新通知：SukiSU 和 BakaSU 均已更新，更新日期为 10月31日 21:00，感谢大家的支持！"];
  const track = document.getElementById('noticeTrack');
  const html = NOTICES.map(t => `<span>${t}</span>`).join('');
  track.innerHTML = html + html;

  const quotes = ["保持热爱，奔赴山海。","星空不问赶路人，时光不负有心人。","万物皆有裂痕，那是光照进来的地方。","愿你眼里有星辰，身边有微风。","满天星河，你是人间理想。"];
  document.getElementById('dailyQuote').innerText = quotes[new Date().getDate() % quotes.length];

  if (localStorage.getItem('suki_is_paid') === 'true') {
    const sukiTag = document.getElementById('sukiTag');
    sukiTag.classList.add('unlocked');
    sukiTag.innerHTML = '已解锁';
  }
</script>

</html>
