<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="public">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>满天星 - OnePlus</title>
<link rel="stylesheet" href="common.css">
<style>
.card-inner { padding: 20px 16px 18px; }
.notice-bar { position: relative; z-index: 11; display: flex; align-items: center; background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.1); border-radius: 10px; padding: 8px 10px; margin-bottom: 16px; font-size: 11px; color: #ffca6b; overflow: hidden; }
.notice-icon { flex-shrink: 0; margin-right: 6px; }
.notice-content { flex: 1; overflow: hidden; }
.notice-track { display: inline-flex; white-space: nowrap; animation: marquee 15s linear infinite; }
.notice-track span { padding-right: 30px; }
.notice-bar:hover .notice-track { animation-play-state: paused; }
@keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
.head { position: relative; z-index: 11; text-align: center; margin-bottom: 18px; }
.logo { position: relative; width: 50px; height: 50px; margin: 0 auto 10px; border-radius: 14px; display: grid; place-items: center; font-size: 22px; font-weight: 900; color: #fff; background: linear-gradient(145deg, #ff5e5e, #ff3b30 40%, #c91414); box-shadow: inset 0 2px 4px rgba(255,255,255,0.4), 0 6px 15px rgba(255,59,48,0.3); z-index: 1; }
.logo::before { content: ''; position: absolute; inset: -4px; border-radius: 18px; background: linear-gradient(145deg, #ff4d4d, #ff3b30); filter: blur(10px); z-index: -1; animation: logoPulse 2s infinite alternate; }
@keyframes logoPulse { 0% { opacity: .2; transform: scale(.9); } 100% { opacity: .7; transform: scale(1.05); } }
h1 { margin-bottom: 6px; font-size: 20px; font-weight: 900; letter-spacing: 1px; background: linear-gradient(100deg, #ffffff 0%, #d4e4ff 50%, #e6d4ff 100%); -webkit-background-clip: text; background-clip: text; color: transparent; display: flex; align-items: baseline; justify-content: center; gap: 6px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8)) drop-shadow(0 0 10px rgba(160, 200, 255, 0.5)); }
.brand { font-size: 12px; font-weight: 800; font-family: "Arial", sans-serif; background: linear-gradient(135deg, #ff6b6b, #ff3b30); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8)) drop-shadow(0 0 8px rgba(255, 59, 48, 0.4)); }
.meta-group { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 16px; }
.meta { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 100px; font-size: 10px; color: #fff; background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.1); }
.dot { width: 4px; height: 4px; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 6px #3ddc84; animation: dotPulse 2s infinite alternate; }
@keyframes dotPulse { 0% { opacity: .5; box-shadow: 0 0 2px #3ddc84; transform: scale(.8); } 100% { opacity: 1; box-shadow: 0 0 10px #3ddc84, 0 0 15px rgba(61,220,132,.4); transform: scale(1.2); } }
.quote { font-size: 10.5px; color: #a0b0d0; font-style: italic; opacity: .9; text-shadow: 0 1px 4px #000; }

/* === 核心：按钮微交互 === */
.btns { position: relative; z-index: 11; display: flex; flex-direction: column; gap: 10px; }
.btn { position: relative; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; overflow: hidden; text-decoration: none; color: var(--text); background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255,255,255,.08); transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s, border-color 0.2s, box-shadow 0.2s; transform: translateZ(0); cursor: pointer; }
.btn::after { content: ''; position: absolute; left: 0; top: 50%; width: 3px; height: 0; border-radius: 0 3px 3px 0; transform: translateY(-50%); background: var(--accent); transition: height .2s ease; }
.btn:hover::after { height: 50%; }
.btn:hover { background: rgba(0, 0, 0, 0.35); border-color: rgba(255,255,255,.15); }
.btn:active { transform: scale(0.95) translateZ(0); background: rgba(255,255,255,0.08); box-shadow: inset 0 0 20px rgba(255,255,255,0.05), 0 0 15px rgba(255, 255, 255, 0.1); }

.ripple { position: absolute; border-radius: 50%; background: rgba(255, 255, 255, 0.4); transform: scale(0); animation: rippleAnim 0.6s cubic-bezier(0.25, 1, 0.5, 1); pointer-events: none; }
@keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }

.icon { flex: 0 0 34px; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--accent); }
.icon svg { width: 18px; height: 18px; }

/* 三行排版布局 */
.text { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.row-1 { display: flex; align-items: center; gap: 6px; }
.row-2 { display: flex; align-items: center; gap: 6px; margin-top: 1px; }
.row-3 { font-size: 10.5px; color: rgba(214,226,255,.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.label { font-size: 13.5px; font-weight: 700; white-space: nowrap; letter-spacing: 0.2px; }

.tag { padding: 1px 4px; border-radius: 4px; font-size: 8.5px; font-weight: 700; flex-shrink: 0; }
.tag-vpn { color: #ffca6b; background: rgba(255,170,40,.15); border: 1px solid rgba(255,170,40,.3); }
.tag-paid { color: #ff6b6b; background: rgba(255,107,107,.15); border: 1px solid rgba(255,107,107,.3); }
.tag-free { color: #3ddc84; background: rgba(61,220,132,.15); border: 1px solid rgba(61,220,132,.3); }

/* === 动态悬浮更新徽标 (极致流畅版) === */
.update-badge { 
  position: relative; display: inline-flex; align-items: center; gap: 4px; padding: 1px 5px; 
  border-radius: 5px; font-size: 9px; font-weight: 700; color: #00e5ff; 
  background: rgba(0, 229, 255, 0.1); border: 1px solid rgba(0, 229, 255, 0.3); 
  flex-shrink: 0; overflow: hidden;
  /* 强制硬件加速，解决卡顿 */
  will-change: transform;
  transform: translateZ(0);
  animation: floatBadge 2.5s ease-in-out infinite;
  box-shadow: 0 0 10px rgba(0, 229, 255, 0.15);
}
.update-badge::before { 
  content: ''; position: absolute; inset: -10px; 
  background: radial-gradient(circle, rgba(0,229,255,0.4) 0%, transparent 70%); 
  z-index: -1; opacity: 0.5; 
}
.update-badge::after { 
  content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; 
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); 
  transform: skewX(-20deg); animation: badgeShine 3s cubic-bezier(0.25, 1, 0.5, 1) infinite; 
}
.update-dot { width: 3px; height: 3px; border-radius: 50%; background: #00e5ff; box-shadow: 0 0 5px #00e5ff; }

@keyframes floatBadge { 
  0%, 100% { transform: translateY(0); } 
  50% { transform: translateY(-3px); } 
}
@keyframes badgeShine { 
  0% { left: -100%; } 
  30% { left: 200%; } 
  100% { left: 200%; } 
}

.arrow { width: 14px; height: 14px; display: grid; place-items: center; color: rgba(255,255,255,.2); transition: transform .2s; flex-shrink: 0; margin-left: 4px; }
.btn:hover .arrow { transform: translateX(2px); color: rgba(255,255,255,.6); }
.arrow svg { width: 12px; height: 12px; }
.btn-suki { --accent: #3b9dff; } .btn-suki .icon { background: rgba(59,157,255,.15); }
.btn-baka { --accent: #ff7a45; } .btn-baka .icon { background: rgba(255,122,69,.15); }
.btn-env { --accent: #2dd4a7; } .btn-env .icon { background: rgba(45,212,167,.15); }
.btn-qq { --accent: #a855f7; } .btn-qq .icon { background: rgba(168,85,247,.15); }
.btn-tg { --accent: #29b6f6; } .btn-tg .icon { background: rgba(41,182,246,.15); }
.btn-key { --accent: #eab308; } .btn-key .icon { background: rgba(234,179,8,.15); }
.foot { position: relative; z-index: 11; margin-top: 16px; text-align: center; font-size: 10px; color: rgba(214,226,255,.4); display: flex; flex-direction: column; gap: 4px; }

/* 按钮内部转圈动画 */
.btn-loading { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: btnSpin 0.6s linear infinite; margin-left: auto; }
@keyframes btnSpin { to { transform: rotate(360deg); } }
</style>

<script src="common.js"></script>
<script>
  const NOTICES = ["最新通知：SukiSU 和 BakaSU 均已更新，更新日期为 10月31日 21:00，感谢大家的支持！"];
  (function renderNotice() {
    const track = document.getElementById('noticeTrack');
    const html = NOTICES.map(t => `<span>${t}</span>`).join('');
    track.innerHTML = html + html;
  })();
  (function () {
    const quotes = ["保持热爱，奔赴山海。","星空不问赶路人，时光不负有心人。","万物皆有裂痕，那是光照进来的地方。","愿你眼里有星辰，身边有微风。","满天星河，你是人间理想。"];
    const dayIdx = new Date().getDate() % quotes.length;
    document.getElementById('dailyQuote').innerText = quotes[dayIdx];
  })();

  // ===== 拦截跳转并显示按钮内转圈 =====
  const allBtns = document.querySelectorAll('.btn');

  allBtns.forEach(btn => {
    btn.addEventListener('click', function(e) {
      const rect = this.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const ripple = document.createElement('span');
      ripple.classList.add('ripple');
      ripple.style.left = `${x}px`;
      ripple.style.top = `${y}px`;
      ripple.style.width = ripple.style.height = `100px`; 
      ripple.style.marginLeft = `-50px`;
      ripple.style.marginTop = `-50px`;
      this.appendChild(ripple);
      setTimeout(() => { ripple.remove(); }, 600);
    });

    btn.addEventListener('click', function(e) {
      if (this.dataset.loading) return;
      e.preventDefault(); 
      this.dataset.loading = "true";

      const targetUrl = this.getAttribute('href');
      const isBlank = this.getAttribute('target') === '_blank';
      const arrow = this.querySelector('.arrow');
      
      if (arrow) {
        arrow.innerHTML = '<span class="btn-loading"></span>';
      }

      setTimeout(() => {
        if (isBlank) {
          window.open(targetUrl, '_blank');
          if (arrow) arrow.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>';
          this.dataset.loading = "";
        } else {
          window.location.href = targetUrl;
        }
      }, 500);
    });
  });
</script>
