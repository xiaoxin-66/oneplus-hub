<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>满天星 - OnePlus</title>
<style>
@property --angle {
  syntax: '<angle>';
  initial-value: 0deg;
  inherits: true;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --angle: 0deg;
  --text: #eef2ff;
  --muted: rgba(214, 226, 255, .46);
}

html, body { height: 100%; }

body {
  min-height: 100dvh;
  /* 👇 替换为下面 4 行 */
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 28px 18px;
  /* 👆 */
  font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  color: var(--text);
  background: #04060a;
  background-image: radial-gradient(circle at 50% 0%, #0d1425 0%, #04060a 100%);
  /* 👇 允许上下滑动，底部不会再被切掉 */
  overflow-y: auto; 
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

/* 鼠标拖尾与点击星尘画布 */
#trailCanvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 999;
  background: transparent; /* 👈 加这一行，确保画布本身绝对透明 */
}

/* 满天星背景 */
.stars {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background-image: 
    radial-gradient(1.5px 1.5px at 20px 30px, #fff, rgba(0,0,0,0)),
    radial-gradient(1px 1px at 40px 70px, #fff, rgba(0,0,0,0)),
    radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
    radial-gradient(1.5px 1.5px at 160px 120px, #fff, rgba(0,0,0,0)),
    radial-gradient(1px 1px at 230px 80px, #fff, rgba(0,0,0,0)),
    radial-gradient(2px 2px at 280px 160px, #fff, rgba(0,0,0,0));
  background-repeat: repeat;
  background-size: 300px 200px;
  animation: twinkle 4s infinite alternate;
}
@keyframes twinkle {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}

.orb {
position: fixed;
  z-index: 1;
  border-radius: 50%;
  filter: blur(120px);
  pointer-events: none;
  opacity: .15;
}
.orb-1 { width: 440px; height: 440px; background: #2f6bff; top: -170px; left: -130px; }
.orb-2 { width: 420px; height: 420px; background: #8b3bff; bottom: -190px; right: -130px; }
.orb-3 { width: 300px; height: 300px; background: #ff3b6b; top: 56%; left: 62%; opacity: .08; }

/* 卡片 */
.card {
  position: relative;
  z-index: 10;
  width: 100%; /* 在 flex 下，它会乖乖占满减去 padding 后的 100% */
  max-width: 432px;
  padding: 2px; /* 边框厚度 */
  border-radius: 28px;
  background: conic-gradient(from var(--angle),
    #2f6bff, #8b5cf6 22%, #ff4d6d 42%, #ff9d3d 58%, #2f6bff 78%, #2f6bff 100%);
  box-shadow: 0 34px 90px -28px rgba(0, 0, 0, .92), 0 0 80px -32px rgba(90, 120, 255, .6);
  animation: cardIn .85s cubic-bezier(.2, .8, .2, 1) both, spin 9s linear infinite;
  
  /* 👇 只留这一行防闪，去掉之前的 will-change 防止尺寸崩坏 */
  transform: translateZ(0);
  overflow: hidden;
}

@keyframes spin { to { --angle: 360deg; } }
@keyframes cardIn {
  from { opacity: 0; transform: translateY(22px) scale(.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.card-inner {
  position: relative;
  isolation: isolate;
  padding: 34px 22px 22px;
  border-radius: 26px; /* 外层 28px 减去内边距 2px，完美贴合 */
  overflow: hidden;
  background: rgba(13, 18, 30, 0.9); 
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
}

.spotlight {
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0;
  transition: opacity .35s ease;
  background: radial-gradient(340px circle at var(--mx, 50%) var(--my, 0%), rgba(120, 160, 255, .10), transparent 62%);
}
.card:hover .spotlight { opacity: 1; }

/* ================= 公告栏 ================= */
.notice-bar {
  position: relative;
  z-index: 11;
  display: flex;
  align-items: center;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 12px;
  padding: 8px 12px;
  margin-bottom: 20px;
  font-size: 12px;
  color: #ffca6b;
  overflow: hidden;
}

.notice-icon {
  flex-shrink: 0;
  margin-right: 8px;
}

.notice-content {
  flex: 1;
  overflow: hidden;
  position: relative;
}

/* 单段文字从右侧 100% 处滑入，滑到 -100% 处消失 */
.notice-text {
  display: inline-block;
  white-space: nowrap;
  padding-left: 100%; 
  animation: marquee 12s linear infinite;
}

@keyframes marquee {
  0% { transform: translateX(0); }
  100% { transform: translateX(-100%); }
}

/* 头部 */
.head {
  position: relative;
  z-index: 1;
  text-align: center;
  margin-bottom: 20px;
}

.logo {
  position: relative;
  width: 66px; height: 66px;
  margin: 0 auto 18px;
  border-radius: 20px;
  display: grid;
  place-items: center;
  overflow: hidden;
  font-size: 25px;
  font-weight: 900;
  letter-spacing: -.5px;
  color: #fff;
  background: linear-gradient(145deg, #ff4d4d, #ff3b30 40%, #d81b1b);
  box-shadow: 0 14px 34px -8px rgba(255, 60, 60, .55), inset 0 1px 0 rgba(255, 255, 255, .45);
  transform: translateZ(0);
}
.logo::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(160deg, rgba(255, 255, 255, .34), transparent 46%);
  pointer-events: none;
}

h1 {
  margin-bottom: 8px;
  font-size: 26px;
  font-weight: 900;
  letter-spacing: 1px;
  background: linear-gradient(100deg, #ffffff 10%, #b9ccff 55%, #d9b6ff 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 8px;
  animation: titlePulse 3s infinite alternate;
  transform: translateZ(0);
}

@keyframes titlePulse {
  from { filter: drop-shadow(0 0 4px rgba(185, 204, 255, 0.3)); }
  to { filter: drop-shadow(0 0 15px rgba(185, 204, 255, 0.8)) drop-shadow(0 0 20px rgba(217, 182, 255, 0.5)); }
}

.brand {
  font-size: 16px;
  font-weight: 800;
  font-family: "Arial", -apple-system, sans-serif;
  letter-spacing: 0;
  background: linear-gradient(135deg, #ff4d4d, #d81b1b);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: 0 0 12px rgba(255, 77, 77, 0.4);
}

/* 动态一言 + 状态标签区 */
.meta-group {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  margin-bottom: 24px;
}

.meta {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 12px;
  border-radius: 100px;
  font-size: 11.5px;
  letter-spacing: .3px;
  color: var(--muted);
  background: rgba(255, 255, 255, .045);
  border: 1px solid rgba(255, 255, 255, .07);
}

.quote {
  font-size: 12px;
  color: #a0b0d0;
  font-style: italic;
  opacity: 0.8;
  letter-spacing: 0.5px;
}

.dot {
  width:5px; height: 5px;
  border-radius: 50%;
  background: #3ddc84;
  box-shadow: 0 0 8px #3ddc84;
  animation: pulse 2.2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50%      { opacity: .28; }
}

/* 按钮列表 */
.btns {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.btn {
  position: relative;
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 11px 14px;
  border-radius: 16px;
  overflow: hidden;
  text-decoration: none;
  color: var(--text);
  background: linear-gradient(135deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, .018));
  border: 1px solid rgba(255, 255, 255, .075);
  transition: transform .3s cubic-bezier(.2, .8, .2, 1), border-color .3s ease, background .3s ease, box-shadow .3s ease;
  animation: rise .65s cubic-bezier(.2, .8, .2, 1) both;
  cursor: pointer;
  transform: translateZ(0);
}

.btn:nth-child(1) { animation-delay: .10s; }
.btn:nth-child(2) { animation-delay: .19s; }
.btn:nth-child(3) { animation-delay: .28s; }
.btn:nth-child(4) { animation-delay: .37s; }
.btn:nth-child(5) { animation-delay: .46s; }
.btn:nth-child(6) { animation-delay: .55s; }

@keyframes rise {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}

.btn::before {
  content: '';
  position: absolute;
  top: -50%; bottom: -50%;
  left: -140%;
  width: 55%;
  pointer-events: none;
  transform: skewX(-20deg);
  background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .10), transparent);
  transition: left .65s cubic-bezier(.3, .7, .3, 1);
}
.btn:hover::before { left: 140%; }

.btn::after {
  content: '';
  position: absolute;
  left: 0; top: 50%;
  width: 3px; height: 0;
  border-radius: 0 3px 3px 0;
  transform: translateY(-50%);
  background: var(--accent);
  transition: height .3s ease;
}
.btn:hover::after { height: 58%; }
.btn:active { transform: translateY(0) scale(.995); }

.icon {
  flex: 0 0 auto;
  width: 42px; height: 42px;
  border-radius: 13px;
  display: grid;
  place-items: center;
  color: var(--accent);
  transition: transform .35s cubic-bezier(.2, .8, .2, 1), background .3s ease, box-shadow .3s ease;
}
.btn:hover .icon { 
  transform: scale(1.1) rotate(-8deg); 
  box-shadow: 0 0 15px var(--accent);
}

.text {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
}
.label {
  display: flex;
  align-items: center;
  flex-wrap: nowrap;
  gap: 6px;
  font-size: 15px;
  font-weight: 650;
  letter-spacing: .2px;
  white-space: nowrap;
}
.desc {
  font-size: 11.5px;
  letter-spacing: .2px;
  color: rgba(214, 226, 255, 0.6);
  transition: color .3s ease;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tag { flex: 0 0 auto; padding: 2px 6px; border-radius: 5px; font-size: 9.5px; font-weight: 700; letter-spacing: .4px; line-height: 1.35; transform: translateY(-1px); transition: .3s ease; }
.tag-vpn { color: #ffca6b; background: rgba(255, 170, 40, .12); border: 1px solid rgba(255, 170, 40, .3); }
.tag-paid { color: #ff6b6b; background: rgba(255, 107, 107, .12); border: 1px solid rgba(255, 107, 107, .3); }
.tag-free { color: #3ddc84; background: rgba(61, 220, 132, .12); border: 1px solid rgba(61, 220, 132, .3); }

.arrow {
  flex: 0 0 auto;
  width: 24px; height: 24px;
  display: grid;
  place-items: center;
  color: rgba(255, 255, 255, .26);
  transition: transform .3s cubic-bezier(.2, .8, .2, 1), color .3s ease;
}
.btn:hover .arrow {
  transform: translateX(4px);
  color: var(--accent);
}

/* 按钮主题色 */
.btn-suki { --accent: #3b9dff; }
.btn-suki .icon { background: rgba(59, 157, 255, .13); box-shadow: inset 0 0 0 1px rgba(59, 157, 255, .22); }
.btn-suki:hover { border-color: rgba(59, 157, 255, .42); background: linear-gradient(135deg, rgba(59, 157, 255, .10), rgba(255, 255, 255, .02)); box-shadow: 0 16px 36px -16px rgba(59, 157, 255, .85); }

.btn-baka { --accent: #ff7a45; }
.btn-baka .icon { background: rgba(255, 122, 69, .13); box-shadow: inset 0 0 0 1px rgba(255, 122, 69, .22); }
.btn-baka:hover { border-color: rgba(255, 122, 69, .42); background: linear-gradient(135deg, rgba(255, 122, 69, .10), rgba(255, 255, 255, .02)); box-shadow: 0 16px 36px -16px rgba(255, 100, 50, .8); }

.btn-env { --accent: #2dd4a7; }
.btn-env .icon { background: rgba(45, 212, 167, .13); box-shadow: inset 0 0 0 1px rgba(45, 212, 167, .22); }
.btn-env:hover { border-color: rgba(45, 212, 167, .42); background: linear-gradient(135deg, rgba(45, 212, 167, .10), rgba(255, 255, 255, .02)); box-shadow: 0 16px 36px -16px rgba(45, 212, 167, .85); }

.btn-qq { --accent: #a855f7; }
.btn-qq .icon { background: rgba(168, 85, 247, .13); box-shadow: inset 0 0 0 1px rgba(168, 85, 247, .22); }
.btn-qq:hover { border-color: rgba(168, 85, 247, .42); background: linear-gradient(135deg, rgba(168, 85, 247, .10), rgba(255, 255, 255, .02)); box-shadow: 0 16px 36px -16px rgba(168, 85, 247, .85); }

.btn-tg { --accent: #29b6f6; }
.btn-tg .icon { background: rgba(41, 182, 246, .13); box-shadow: inset 0 0 0 1px rgba(41, 182, 246, .22); }
.btn-tg:hover { border-color: rgba(41, 182, 246, .42); background: linear-gradient(135deg, rgba(41, 182, 246, .10), rgba(255, 255, 255, .02)); box-shadow: 0 16px 36px -16px rgba(41, 182, 246, .85); }

.btn-key { --accent: #eab308; }
.btn-key .icon { background: rgba(234, 179, 8, .13); box-shadow: inset 0 0 0 1px rgba(234, 179, 8, .22); }
.btn-key:hover { border-color: rgba(234, 179, 8, .42); background: linear-gradient(135deg, rgba(234, 179, 8, .10), rgba(255, 255, 255, .02)); box-shadow: 0 16px 36px -16px rgba(234, 179, 8, .85); }

/* 底部信息 */
.foot {
  position: relative;
  z-index: 1;
  margin-top: 24px;
  text-align: center;
  font-size: 11px;
  letter-spacing: .4px;
  color: rgba(214, 226, 255, .35);
  display: flex;
  flex-direction: column;
  gap: 6px;

.visitor-count {
  font-size: 10px;
  color: rgba(214, 226, 255, 0.25);

@media (max-width: 400px) {
  .card-inner { padding: 30px 20px 20px; }
  h1 { font-size: 22px; }
  .logo { width: 58px; height: 58px; font-size: 22px; border-radius: 17px; }
  .btn { padding: 12px 12px; gap: 11px; }
  .icon { width: 38px; height: 38px; border-radius: 11px; }
  .label { font-size: 14px; }
  .tag { font-size: 9px; }
}
</style>

<script>
  // 1. 鼠标跟随光斑逻辑
  (function () {
    const inner = document.querySelector('.card-inner');
    if(!inner) return;
    if(!window.matchMedia('(hover: hover)').matches) return;
    inner.addEventListener('pointermove', function (e) {
      const rect = inner.getBoundingClientRect();
      inner.style.setProperty('--mx', (e.clientX - rect.left) + 'px');
      inner.style.setProperty('--my', (e.clientY - rect.top) + 'px');
    });
  })();

  // 2. 每日随机金句
  (function () {
    const quotes = [
      "保持热爱，奔赴山海。",
      "星空不问赶路人，时光不负有心人。",
      "万物皆有裂痕，那是光照进来的地方。",
      "愿你眼里有星辰，身边有微风。",
      "且将新火试新茶，诗酒趁年华。",
      "星光不问赶路人，岁月不负有心人。",
      "满天星河，你是人间理想。"
    ];
    const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
    document.getElementById('dailyQuote').innerText = randomQuote;
  })();

  // 3. 星光拖尾与点击绽放粒子特效
  (function() {
    const canvas = document.getElementById('trailCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let particles = [];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 监听移动（拖尾）
    window.addEventListener('pointermove', function(e) {
      for (let i = 0; i < 2; i++) {
        particles.push({
          x: e.clientX,
          y: e.clientY,
          vx: (Math.random() - 0.5) * 2,
          vy: (Math.random() - 0.5) * 2,
          life: 1,
          size: Math.random() * 2 + 1,
          color: Math.random() > 0.5 ? '185, 204, 255' : (Math.random() > 0.5 ? '217, 182, 255' : '255, 255, 255')
        });
      }
    });

    // 监听点击（绽放）
    window.addEventListener('pointerdown', function(e) {
      // 点击时爆发 15 个粒子
      for (let i = 0; i < 15; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        particles.push({
          x: e.clientX,
          y: e.clientY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          size: Math.random() * 2.5 + 1.5,
          color: Math.random() > 0.5 ? '255, 107, 107' : (Math.random() > 0.5 ? '234, 179, 8' : '185, 204, 255')
        });
      }
    });

    function animate() {
      ctx.clearRect(0, 0, width, height);
      for (let i = 0; i < particles.length; i++) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.03;
        
        if (p.life > 0) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${p.color}, ${p.life})`;
          ctx.fill();
        } else {
          particles.splice(i, 1);
          i--;
        }
      }
      requestAnimationFrame(animate);
    }
    animate();
  })();

  // 4. 防审查元素（防右键、防 F12）
  (function() {
    // 禁止右键菜单
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
    });
    
    // 禁止 F12 和常用审查快捷键
    document.addEventListener('keydown', function(e) {
      // 禁止 F12
      if (e.key === 'F12' || e.keyCode === 123) {
        e.preventDefault();
        return false;
      }
      // 禁止 Ctrl+Shift+I / Ctrl+Shift+C / Ctrl+Shift+J
      if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'C' || e.key === 'c' || e.key === 'J' || e.key === 'j')) {
        e.preventDefault();
        return false;
      }
      // 禁止 Ctrl+U (查看源码)
      if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) {
        e.preventDefault();
        return false;
      }
    });
  })();
</script>
</body>
</html>
