<style>
body { overflow-x: hidden; -webkit-tap-highlight-color: transparent; }

/* 卡片基础样式：改为自适应高度，过度极其平滑 */
.card-inner { 
  padding: 20px 16px 18px; 
  position: relative; 
  display: flex; 
  flex-direction: column; 
  transition: height 0.3s cubic-bezier(0.25, 1, 0.5, 1);
}

/* === 视图容器 === */
.view-container { width: 100%; flex: 1; display: flex; flex-direction: column; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

/* ================= 首页列表视图 ================= */
.notice-bar { position: relative; z-index: 11; display: flex; align-items: center; background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.1); border-radius: 10px; padding: 8px 10px; margin-bottom: 16px; font-size: 11px; color: #ffca6b; overflow: hidden; }
.notice-icon { flex-shrink: 0; margin-right: 6px; }
.notice-content { flex: 1; overflow: hidden; }
.notice-track { display: inline-flex; white-space: nowrap; animation: marquee 15s linear infinite; }
.notice-track span { padding-right: 30px; }
@keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

.head { position: relative; z-index: 11; text-align: center; margin-bottom: 18px; }
.logo { position: relative; width: 50px; height: 50px; margin: 0 auto 10px; border-radius: 14px; display: grid; place-items: center; font-size: 22px; font-weight: 900; color: #fff; background: linear-gradient(145deg, #ff5e5e, #ff3b30 40%, #c91414); box-shadow: inset 0 2px 4px rgba(255,255,255,0.4), 0 6px 15px rgba(255,59,48,0.3); z-index: 1; }
.logo::before { content: ''; position: absolute; inset: -4px; border-radius: 18px; background: linear-gradient(145deg, #ff4d4d, #ff3b30); filter: blur(10px); z-index: -1; animation: logoPulse 2s infinite alternate; }
@keyframes logoPulse { 0% { opacity: .2; transform: scale(.9); } 100% { opacity: .7; transform: scale(1.05); } }
h1 { margin-bottom: 6px; font-size: 20px; font-weight: 900; letter-spacing: 1px; background: linear-gradient(100deg, #ffffff 0%, #d4e4ff 50%, #e6d4ff 100%); -webkit-background-clip: text; background-clip: text; color: transparent; display: flex; align-items: baseline; justify-content: center; gap: 6px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8)); }
.brand { font-size: 12px; font-weight: 800; font-family: "Arial", sans-serif; background: linear-gradient(135deg, #ff6b6b, #ff3b30); -webkit-background-clip: text; background-clip: text; color: transparent; }
.meta-group { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 16px; }
.meta { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 100px; font-size: 10px; color: #fff; background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.1); }
.dot { width: 4px; height: 4px; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 6px #3ddc84; animation: dotPulse 2s infinite alternate; }
@keyframes dotPulse { 0% { opacity: .5; box-shadow: 0 0 2px #3ddc84; transform: scale(.8); } 100% { opacity: 1; box-shadow: 0 0 10px #3ddc84; transform: scale(1.2); } }
.quote { font-size: 10.5px; color: #a0b0d0; font-style: italic; opacity: .9; text-shadow: 0 1px 4px #000; }

.btns { position: relative; z-index: 11; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.btn { position: relative; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; overflow: hidden; text-decoration: none; color: var(--text); background: rgba(0, 0, 0, 0.25); border: 1px solid rgba(255,255,255,.08); transition: transform 0.2s; cursor: pointer; }
.btn:hover { background: rgba(0, 0, 0, 0.4); border-color: rgba(255,255,255,.15); }
.btn:active { transform: scale(0.96); background: rgba(255,255,255,0.08); }

.icon { flex: 0 0 34px; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--accent); }
.icon svg { width: 18px; height: 18px; }
.text { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 3px; }
.row-1 { display: flex; align-items: center; gap: 6px; }
.row-2 { display: flex; align-items: center; gap: 6px; }
.row-3 { font-size: 10.5px; color: rgba(214,226,255,.5); }
.label { font-size: 13.5px; font-weight: 700; white-space: nowrap; }

.tag { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 100px; font-size: 9.5px; font-weight: 800; line-height: 1; letter-spacing: 0.5px; transition: all 0.4s; }
.tag-vpn { color: #ffca6b; background: rgba(255,170,40,.15); border: 1px solid rgba(255,170,40,.35); }
.tag-paid { color: #ff6b6b; background: rgba(255,107,107,.15); border: 1px solid rgba(255,107,107,.35); }
.tag-free { color: #3ddc84; background: rgba(61,220,132,.15); border: 1px solid rgba(61,220,132,.35); }
.tag-paid.unlocked { color: #3ddc84; background: rgba(61,220,132,.25); border: 1px solid rgba(61,220,132,.5); animation: capsuleGlow 2s infinite alternate; }
@keyframes capsuleGlow { 0% { box-shadow: 0 0 5px rgba(61,220,132,.2); } 100% { box-shadow: 0 0 15px rgba(61,220,132,.5); } }
.update-badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 6px; border-radius: 6px; font-size: 9px; font-weight: 700; color: #00e5ff; background: rgba(0,229,255,.1); border: 1px solid rgba(0, 229, 255, 0.25); animation: floatBadge 2.5s infinite; }
.update-dot { width: 4px; height: 4px; border-radius: 50%; background: #00e5ff; box-shadow: 0 0 5px #00e5ff; }
@keyframes floatBadge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }

.arrow { width: 14px; height: 14px; display: grid; place-items: center; color: rgba(255,255,255,.2); flex-shrink: 0; margin-left: 4px; }
.btn-suki { --accent: #3b9dff; } .btn-suki .icon { background: rgba(59,157,255,.15); }
.btn-baka { --accent: #ff7a45; } .btn-baka .icon { background: rgba(255,122,69,.15); }
.btn-env { --accent: #2dd4a7; } .btn-env .icon { background: rgba(45,212,167,.15); }
.btn-qq { --accent: #a855f7; } .btn-qq .icon { background: rgba(168,85,247,.15); }
.btn-tg { --accent: #29b6f6; } .btn-tg .icon { background: rgba(41,182,246,.15); }
.btn-key { --accent: #eab308; } .btn-key .icon { background: rgba(234,179,8,.15); }
.foot { position: relative; z-index: 11; margin-top: 16px; text-align: center; font-size: 10px; color: rgba(214,226,255,.4); }

/* ================= 内部新界面视图 ================= */
.view-header { display: flex; align-items: center; margin-bottom: 24px; }
.back-icon { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.05); display: grid; place-items: center; cursor: pointer; color: #fff; margin-right: 12px; transition: all 0.2s; }
.back-icon:active { transform: scale(0.9); background: rgba(255,255,255,0.2); }

.verify-content { display: flex; flex-direction: column; align-items: center; width: 100%; animation: fadeIn 0.3s ease; padding-bottom: 20px; }
.input-group { position: relative; margin-bottom: 16px; width: 100%; }
input { width: 100%; padding: 14px 44px; border-radius: 14px; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255,255,255,0.15); color: #fff; font-size: 16px; text-align: center; outline: none; font-family: inherit; letter-spacing: 2px; box-sizing: border-box; }
input:focus { border-color: rgba(59,157,255,0.6); box-shadow: 0 0 20px rgba(59,157,255,0.3); background: rgba(0,0,0,0.5); }
.eye { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; display: grid; place-items: center; background: transparent; border: none; color: rgba(255,255,255,.5); cursor: pointer; }
.eye svg { width: 20px; height: 20px; }
.eye.active svg { color: #3b9dff; }

.err { color: #ff4d4d; font-size: 12px; height: 20px; margin-bottom: 12px; opacity: 0; transition: opacity .3s; font-weight: 500; }
.err.show { opacity: 1; }
button.verify { width: 100%; padding: 15px; border-radius: 14px; background: linear-gradient(180deg, #3b9dff, #2f6bff); color: #fff; border: none; font-size: 15px; font-weight: bold; cursor: pointer; margin-bottom: 10px; transition: transform 0.2s; }
button.verify:active:not(:disabled) { transform: scale(0.96); }
button.verify:disabled { background: #2a3245; color: rgba(255,255,255,.3); cursor: not-allowed; }

.qr-container { position: relative; display: inline-block; margin-bottom: 10px; padding: 3px; border-radius: 20px; background: linear-gradient(135deg, #8b5cf6, #29b6f6, #eab308); }
.qr-wrap { position: relative; background: #fff; padding: 10px; border-radius: 17px; overflow: hidden; width: 210px; height: 210px; display: flex; align-items: center; justify-content: center; }
.qr-wrap img { display: block; width: 100%; height: 100%; object-fit: contain; border-radius: 10px; }
.scan-line { position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, transparent, #8b5cf6, #eab308, transparent); animation: scan 3s infinite; z-index: 10; }
@keyframes scan { 0% { top: -5%; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 105%; opacity: 0; } }

.btn-loading { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: btnSpin 0.6s linear infinite; margin-right: 6px; }
@keyframes btnSpin { to { transform: rotate(360deg); } }
.shake { animation: shake 0.4s; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
</style>

<script>
  const NOTICES = ["最新通知：SukiSU 和 BakaSU 均已更新，更新日期为 10月31日 21:00，感谢大家的支持！"];
  const track = document.getElementById('noticeTrack');
  const html = NOTICES.map(t => `<span>${t}</span>`).join('');
  track.innerHTML = html + html;

  const quotes = ["保持热爱，奔赴山海。","星空不问赶路人，时光不负有心人。","万物皆有裂痕，那是光照进来的地方。","愿你眼里有星辰，身边有微风。","满天星河，你是人间理想。"];
  document.getElementById('dailyQuote').innerText = quotes[new Date().getDate() % quotes.length];

  if (localStorage.getItem('suki_is_paid') === 'true') {
    const sukiTag = document.getElementById('sukiTag');
    sukiTag.classList.add('unlocked');
    sukiTag.innerHTML = '已解锁';
  }

  // ==== 视图切换逻辑 ====
  const viewList = document.getElementById('viewList');
  const viewSuki = document.getElementById('viewSuki');
  const viewKey = document.getElementById('viewKey');
  const sukiArrow = document.getElementById('sukiArrow');

  function showView(type) {
    viewList.style.display = 'none';
    viewSuki.style.display = 'none';
    viewKey.style.display = 'none';

    // 核心修复：回到列表时，强制把箭头恢复原状
    if (type === 'list') {
      viewList.style.display = 'flex';
      sukiArrow.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>';
    }
    if (type === 'suki') viewSuki.style.display = 'flex';
    if (type === 'key') viewKey.style.display = 'flex';
  }

  // 终极防回弹修复：处理浏览器“往返缓存”恢复时的状态重置
  window.addEventListener('pageshow', function(event) {
    if (event.persisted || (typeof performance !== 'undefined' && performance.getEntriesByType('navigation')[0].type === 'back_forward')) {
      showView('list'); // 强制切回列表，消灭残留状态
    }
  });

  const KEY_HASH   = "380423258a33c2c583868f680484ac9741846f583a2730882f0ba379efd84c5b";
  const SALT_B64   = "6iRrrBIgb+VAeaumRGCFoQ==";
  const IV_B64     = "bH3f4QlL0CRHRyyD";
  const CIPHER_B64 = "Y8BLD3lFaoACJJ4Soh3SGJcMIN4kbVnlmmmk8BgMPW1jBuwKhX+V3H4hdEYIKmE7qm+teDQ=";

  const b64ToU8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  async function handleSukiClick(element) {
    const savedKey = localStorage.getItem('suki_saved_key');
    if (savedKey) {
      sukiArrow.innerHTML = '<span class="btn-loading"></span>';
      
      try {
        const enc = new TextEncoder();
        const baseKey = await crypto.subtle.importKey('raw', enc.encode(savedKey), 'PBKDF2', false, ['deriveKey']);
        const aesKey = await crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: b64ToU8(SALT_B64), iterations: 100000, hash: 'SHA-256' },
          baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
        );
        const pt = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: b64ToU8(IV_B64) },
          aesKey, b64ToU8(CIPHER_B64)
        );
        const url = new TextDecoder().decode(pt);
        window.location.href = url;
        return;
      } catch (e) {
        localStorage.removeItem('suki_saved_key');
        localStorage.removeItem('suki_is_paid');
        sukiArrow.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>';
      }
    }
    showView('suki');
    checkLockStatus(); 
  }

  const MAX_TRIES = 5;
  const LOCK_TIME = 10 * 60 * 1000;
  const passInput = document.getElementById('pass');
  const verifyBtn = document.getElementById('verifyBtn');
  const errText = document.getElementById('err');
  const eyeBtn = document.getElementById('eyeBtn');
  const eyeIcon = document.getElementById('eyeIcon');
  let isVerifying = false;
  let timerInterval = null;

  const eyeOpen = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"></path><circle cx="12" cy="12" r="3"></circle>`;
  const eyeClosed = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;

  eyeBtn.addEventListener('click', () => {
    if (passInput.type === 'password') {
      passInput.type = 'text';
      eyeIcon.innerHTML = eyeOpen;
      eyeBtn.classList.add('active');
    } else {
      passInput.type = 'password';
      eyeIcon.innerHTML = eyeClosed;
      eyeBtn.classList.remove('active');
    }
  });

  const u8ToHex = u8 => [...u8].map(b => b.toString(16).padStart(2, '0')).join('');

  verifyBtn.addEventListener('click',async () => {
    if (verifyBtn.disabled || isVerifying) return;
    const val = passInput.value.trim();
    if (!val) return;

    isVerifying = true;
    verifyBtn.disabled = true;
    const originalText = verifyBtn.innerHTML;
    verifyBtn.innerHTML = '<span class="btn-loading"></span> 验证中...';
    errText.classList.remove('show');

    try {
      const enc = new TextEncoder();
      const digest = await crypto.subtle.digest('SHA-256', enc.encode(val));
      
      if (u8ToHex(new Uint8Array(digest)) !== KEY_HASH) { 
        verifyBtn.innerHTML = originalText;
        verifyBtn.disabled = false;
        isVerifying = false;
        document.getElementById('sukiCard').classList.add('shake');
        setTimeout(() => document.getElementById('sukiCard').classList.remove('shake'), 400);
        handleFail(); 
        return; 
      }

      const baseKey = await crypto.subtle.importKey('raw', enc.encode(val), 'PBKDF2', false, ['deriveKey']);
      const aesKey = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: b64ToU8(SALT_B64), iterations: 100000, hash: 'SHA-256' },
        baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
      );
      const pt = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: b64ToU8(IV_B64) },
        aesKey, b64ToU8(CIPHER_B64)
      );
      const url = new TextDecoder().decode(pt);

      localStorage.setItem('suki_is_paid', 'true');
      localStorage.setItem('suki_saved_key', val);
      localStorage.removeItem('suki_fail_count');
      localStorage.removeItem('suki_lock_until');
      
      const sukiTag = document.getElementById('sukiTag');
      sukiTag.classList.add('unlocked');
      sukiTag.innerHTML = '已解锁';

      verifyBtn.innerHTML = '<span class="btn-loading"></span> 跳转中...';
      setTimeout(() => { window.location.href = url; }, 300);

    } catch (e) {
      verifyBtn.innerHTML = originalText;
      verifyBtn.disabled = false;
      isVerifying = false;
      handleFail();
    }
  });

  function handleFail() {
    let failCount = parseInt(localStorage.getItem('suki_fail_count') || '0') + 1;
    localStorage.setItem('suki_fail_count', failCount);
    const remain = MAX_TRIES - failCount;

    document.getElementById('sukiCard').classList.add('shake');
    setTimeout(() => document.getElementById('sukiCard').classList.remove('shake'), 400);

    if (failCount >= MAX_TRIES) {
      localStorage.setItem('suki_lock_until', Date.now() + LOCK_TIME);
      checkLockStatus();
    } else {
      showError(`密钥错误，您还有 ${remain} 次尝试机会`);
      passInput.value = '';
      passInput.focus();
      verifyBtn.disabled = false; 
    }
  }

  function showError(msg) { 
    errText.innerText = msg; 
    errText.classList.add('show'); 
  }

  function checkLockStatus() {
    const lockUntil = localStorage.getItem('suki_lock_until');
    if (lockUntil && Date.now() < lockUntil) {
      passInput.disabled = true;
      verifyBtn.disabled = true;
      if (timerInterval) clearInterval(timerInterval);
      
      const updateTimer = () => {
        const left = lockUntil - Date.now();
        if (left <= 0) {
          clearInterval(timerInterval);
          localStorage.removeItem('suki_fail_count');
          localStorage.removeItem('suki_lock_until');
          unlockInputs();
        } else {
          const m = Math.floor(left / 60000);
          const s = Math.floor((left % 60000) / 1000);
          showError(`错误次数过多，请 ${m}分${s < 10 ? '0'+s : s}秒 后重试`);
        }
      };
      
      updateTimer();
      timerInterval = setInterval(updateTimer, 1000);
      
    } else {
      if (lockUntil) {
        localStorage.removeItem('suki_fail_count');
        localStorage.removeItem('suki_lock_until');
      }
      unlockInputs();
    }
  }

  function unlockInputs() {
    passInput.disabled = false;
    verifyBtn.disabled = false;
    errText.classList.remove('show');
    verifyBtn.innerHTML = '验证并前往下载';
  }

  passInput.addEventListener('keydown', e => { 
    if (e.key === 'Enter' && !verifyBtn.disabled) {
      verifyBtn.click(); 
    }
  });
  passInput.addEventListener('input', () => errText.classList.remove('show'));
</script>
