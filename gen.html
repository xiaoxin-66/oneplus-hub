<!DOCTYPE html>
<meta charset="utf-8">
<title>生成密钥哈希与密文</title>
<pre id="out" style="white-space:pre-wrap;font-size:13px"></pre>
<script>
(async () => {
  // ====== 改这两行 ======
  const REAL_KEY = 'H7052.';                                  // 真实密钥
  const REAL_URL = 'https://www.123684.com/s/YXhyVv-kcWsH';   // 真实下载地址
  // ======================

  const enc = new TextEncoder();

  const keyHashBuf = await crypto.subtle.digest('SHA-256', enc.encode(REAL_KEY));
  const keyHash = [...new Uint8Array(keyHashBuf)].map(b => b.toString(16).padStart(2, '0')).join('');

  const baseKey = await crypto.subtle.importKey('raw', enc.encode(REAL_KEY), 'PBKDF2', false, ['deriveKey']);
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const aesKey = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
    baseKey, { name: 'AES-GCM', length: 256 }, false, ['encrypt']
  );
  const ctBuf = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, aesKey, enc.encode(REAL_URL));

  const b64 = u8 => btoa(String.fromCharCode(...u8));
  document.getElementById('out').textContent =
`const KEY_HASH   = "${keyHash}";
const SALT_B64   = "${b64(salt)}";
const IV_B64     = "${b64(iv)}";
const CIPHER_B64 = "${b64(new Uint8Array(ctBuf))}";`;
})();
</script>
