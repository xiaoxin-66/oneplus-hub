<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>获取密钥</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: radial-gradient(circle at 50% 0%, #0d1425 0%, #04060a 100%);
  color: #eef2ff;
  font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  padding: 20px;
  overflow: hidden;
}

/* 满天星背景 */
.stars {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: 
    radial-gradient(1.5px 1.5px at 20px 30px, #fff, rgba(0,0,0,0)),
    radial-gradient(1px 1px at 40px 70px, #fff, rgba(0,0,0,0)),
    radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
    radial-gradient(1.5px 1.5px at 160px 120px, #fff, rgba(0,0,0,0)),
    radial-gradient(1px 1px at 230px 80px, #fff, rgba(0,0,0,0));
  background-repeat: repeat;
  background-size: 300px 200px;
  animation: twinkle 4s infinite alternate;
}
@keyframes twinkle {
  0%, 100% { opacity: 0.2; }
  50% { opacity: 0.8; }
}

/* 背景光晕 */
.orb {
  position: fixed; border-radius: 50%; filter: blur(120px);
  pointer-events: none; z-index: 0; opacity: .15;
}
.orb-1 { width: 350px; height: 350px; background: #eab308; top: -100px; right: -100px; opacity: 0.1; }
.orb-2 { width: 350px; height: 350px; background: #8b3bff; bottom: -100px; left: -100px; }

/* 毛玻璃卡片 */
.card {
  position: relative;
  z-index: 1;
  background: rgba(13, 18, 30, 0.85);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  padding: 35px 25px;
  border-radius: 24px;
  width: 100%;
  max-width: 360px;
  text-align: center;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.15);
  animation: slideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* 顶部图标 */
.icon {
  width: 64px; height: 64px;
  margin: 0 auto 16px;
  border-radius: 20px;
  display: grid; place-items: center;
  background: rgba(234, 179, 8, 0.1);
  border: 1px solid rgba(234, 179, 8, 0.3);
  color: #eab308;
  box-shadow: 0 0 20px rgba(234, 179, 8, 0.15);
  animation: iconPulse 3s infinite alternate;
}
@keyframes iconPulse {
  from { box-shadow: 0 0 10px rgba(234, 179, 8, 0.1); }
  to { box-shadow: 0 0 30px rgba(234, 179, 8, 0.5); }
}

h2 { margin-bottom: 8px; font-size: 22px; font-weight: 800; letter-spacing: 1px; color: #fff; }
p { margin-bottom: 24px; font-size: 13px; color: rgba(214, 226, 255, 0.6); line-height: 1.5; }

/* 二维码外发光容器 */
.qr-container {
  position: relative;
  display: inline-block;
  margin-bottom: 26px;
  padding: 2px;
  border-radius: 22px;
  background: linear-gradient(135deg, #8b5cf6, #29b6f6, #eab308); 
  box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 25px rgba(139, 92, 246, 0.3);
  animation: float 4s ease-in-out infinite;
}

/* 二维码内部白底 */
.qr-wrap {
  position: relative;
  background: #fff;
  padding: 10px;
  border-radius: 20px;
  overflow: hidden;
}

/* 图片样式（已放大） */
.qr-wrap img {
  display: block;
  width: 220px;
  height: 220px;
  object-fit: contain;
  border-radius: 10px;
}

/* 科技感扫描线（已变细） */
.scan-line {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 2px;
  background: linear-gradient(90deg, transparent, #8b5cf6, #eab308, transparent);
  box-shadow: 0 0 12px #8b5cf6, 0 0 4px #eab308;
  animation: scan 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
}

/* 悬浮呼吸动画 */
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

/* 扫描动画 */
@keyframes scan {
  0% { top: -5%; opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { top: 105%; opacity: 0; }
}

/* 返回首页按钮 */
.back-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
  padding: 14px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.05);
  color: rgba(255, 255, 255, 0.8);
  border: 1px solid rgba(255, 255, 255, 0.1);
  font-size: 15px;
  font-weight: bold;
  text-decoration: none;
  transition: all 0.3s;
}
.back-btn:hover {
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
  transform: translateY(-2px);
}
.back-btn:active { transform: translateY(0); }
</style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

  <div class="icon">

    </svg>
  </div>
  <h2>获取密钥</h2>
