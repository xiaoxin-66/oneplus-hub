<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>获取密钥 - 满天星</title>
<link rel="stylesheet" href="common.css">
<style>
.card-inner { padding: 30px 20px 24px; text-align: center; }

.icon {
  position: relative;
  width: 54px; height: 54px;
  margin: 0 auto 16px;
  border-radius: 16px;
  display: grid; place-items: center;
  background: rgba(234,179,8,.15);
  border: 1px solid rgba(234,179,8,.3);
  color: #eab308;
  z-index: 1;
}
.icon::before {
  content: '';
  position: absolute; inset: -4px;
  border-radius: 20px;
  background: #eab308;
  filter: blur(10px);
  z-index: -1;
  animation: iconPulse 2s infinite alternate;
}
@keyframes iconPulse {
  0% { opacity: .2; transform: scale(.9); }
  100% { opacity: .6; transform: scale(1.1); }
}

h2 { 
  margin-bottom: 6px; font-size: 20px; font-weight: 800; letter-spacing: 1px; color: #fff; 
  text-shadow: 0 2px 10px rgba(0,0,0,0.8);
}
p { 
  margin-bottom: 20px; font-size: 12px; color: rgba(255,255,255,0.8); 
  text-shadow: 0 1px 4px rgba(0,0,0,0.5); line-height: 1.5; 
}

.qr-container {
  position: relative;
  display: inline-block;
  margin-bottom: 20px;
  padding: 2px;
  border-radius: 16px;
  background: linear-gradient(135deg, #8b5cf6, #29b6f6, #eab308);
  box-shadow: 0 8px 25px rgba(0,0,0,.5), 0 0 20px rgba(139,92,246,.3);
  animation: float 4s ease-in-out infinite;
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

.qr-wrap {
  position: relative;
  background: #fff;
  padding: 8px;
  border-radius: 14px;
  overflow: hidden;
  width: 200px;
  height: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.qr-wrap img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: 8px;
}

.scan-line {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 2px;
  background: linear-gradient(90deg, transparent, #8b5cf6, #eab308, transparent);
  box-shadow: 0 0 10px #8b5cf6;
  animation: scan 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  z-index: 10;
}
@keyframes scan {
  0% { top: -5%; opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { top: 105%; opacity: 0; }
}

.back-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  background: rgba(255,255,255,.06);
  color: rgba(255,255,255,.8);
  border: 1px solid rgba(255,255,255,.15);
  font-size: 13px;
  font-weight: bold;
  text-decoration: none;
  transition: background .3s, color .3s, border-color .3s, transform .3s;
}
.back-btn:hover { background: rgba(255,255,255,.12); color: #fff; border-color: rgba(255,255,255,.3); transform: translateY(-2px); }
</style>
</head>
<body>

<div class="stars" aria-hidden="true"></div>
<div class="planet" aria-hidden="true"></div>
<div class="orb orb-1" aria-hidden="true"></div>
<div class="orb orb-2" aria-hidden="true"></div>

<main class="card">
  <div class="card-inner">
    <div class="icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>
      </svg>
    </div>
    <h2>获取密钥</h2>
    <p>扫描下方二维码联系管理员<br>购买并获取验证密钥</p>

    <div class="qr-container">
      <div class="qr-wrap">
        <img src="qrcode.jpg?v=3" alt="扫码联系管理员获取密钥" loading="lazy" width="184" height="184">
        <div class="scan-line"></div>
      </div>
    </div>

    <a href="index.html" class="back-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
      返回首页
    </a>
  </div>
</main>

<script src="common.js"></script>
</body>
</html>
