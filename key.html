<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="public">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>获取密钥 - 满天星</title>
<link rel="stylesheet" href="common.css">
<style>
.card-inner { padding: 36px 24px 28px; text-align: center; }

.icon { 
  position: relative; width: 60px; height: 60px; margin: 0 auto 20px; 
  border-radius: 18px; display: grid; place-items: center; 
  background: rgba(234,179,8,.15); border: 1px solid rgba(255,255,255,.1); 
  box-shadow: inset 0 2px 4px rgba(255,255,255,0.05); 
  color: #eab308; z-index: 1; 
}
.icon::before { 
  content: ''; position: absolute; inset: -6px; border-radius: 24px; 
  background: #eab308; filter: blur(12px); z-index: -1; 
  animation: iconPulse 2s infinite alternate; 
}
@keyframes iconPulse { 0% { opacity: .15; transform: scale(.9); } 100% { opacity: .4; transform: scale(1.1); } }

h2 { margin-bottom: 8px; font-size: 22px; font-weight: 800; letter-spacing: 1px; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
p { margin-bottom: 24px; font-size: 13px; color: rgba(255,255,255,0.6); text-shadow: 0 1px 4px rgba(0,0,0,0.5); line-height: 1.6; }

.qr-container { 
  position: relative; display: inline-block; margin-bottom: 24px; padding: 3px; 
  border-radius: 20px; background: linear-gradient(135deg, #8b5cf6, #29b6f6, #eab308); 
  box-shadow: 0 10px 30px rgba(0,0,0,.6), 0 0 20px rgba(139,92,246,.2); 
  animation: float 5s ease-in-out infinite; 
}
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

.qr-wrap { 
  position: relative; background: #fff; padding: 10px; border-radius: 17px; 
  overflow: hidden; width: 210px; height: 210px; 
  display: flex; align-items: center; justify-content: center; 
}
.qr-wrap img { display: block; width: 100%; height: 100%; object-fit: contain; border-radius: 10px; }

.scan-line { 
  position: absolute; top: 0; left: 0; width: 100%; height: 2px; 
  background: linear-gradient(90deg, transparent, #8b5cf6, #eab308, transparent); 
  box-shadow: 0 0 12px #8b5cf6; 
  animation: scan 3s cubic-bezier(0.4, 0, 0.2, 1) infinite; z-index: 10; 
}
@keyframes scan { 0% { top: -5%; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 105%; opacity: 0; } }

.back-btn { 
  display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; 
  padding: 14px; border-radius: 14px; background: rgba(255,255,255,.08); 
  color: rgba(255,255,255,.8); border: 1px solid rgba(255,255,255,.1); 
  font-size: 14px; font-weight: bold; text-decoration: none; 
  transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); 
  transform: translateZ(0);
  position: relative; z-index: 50; cursor: pointer; overflow: hidden;
}
.back-btn:hover { background: rgba(255,255,255,.15); color: #fff; border-color: rgba(255,255,255,.2); }
.back-btn:active { transform: scale(0.92) translateZ(0); background: rgba(255,255,255,.2); }

.ripple { position: absolute; border-radius: 50%; background: rgba(255, 255, 255, 0.3); transform: scale(0); animation: rippleAnim 0.6s cubic-bezier(0.25, 1, 0.5, 1); pointer-events: none; }
@keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }

/* 按钮内部转圈动画 */
.btn-loading {
  display: inline-block;
  width: 14px; height: 14px;
  border: 2px solid rgba(255,255,255,0.2);
  border-top-color: #fff;
  border-radius: 50%;
  animation: btnSpin 0.6s linear infinite;
}
@keyframes btnSpin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<main class="card">
  <div class="card-inner">
    <div class="icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>
      </svg>
    </div>
    <h2>获取密钥</h2>
    <p>扫描下方二维码联系管理员<br>购买并获取验证密钥</p>

    <div class="qr-container">
      <div class="qr-wrap">
        <img src="qrcode.jpg?v=3" alt="扫码联系管理员获取密钥" loading="lazy" width="190" height="190">
        <div class="scan-line"></div>
      </div>
    </div>

    <a href="index.html" class="back-btn" id="backBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="15 18 9 12 15 6"></polyline></svg>
      返回首页
    </a>
  </div>
</main>

<script src="common.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const backBtn = document.getElementById('backBtn');

    backBtn.addEventListener('click', function(e) {
      if (this.dataset.loading) return; // 防止重复点击
      e.preventDefault(); // 阻止立即跳转
      this.dataset.loading = "true";

      // 涟漪特效
      const rect = this.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const ripple = document.createElement('span');
      ripple.classList.add('ripple');
      ripple.style.left = `${x}px`;
      ripple.style.top = `${y}px`;
      ripple.style.width = ripple.style.height = `150px`; 
      ripple.style.marginLeft = `-75px`;
      ripple.style.marginTop = `-75px`;
      this.appendChild(ripple);
      
      // 替换按钮内容为转圈
      const originalHTML = this.innerHTML;
      this.innerHTML = '<span class="btn-loading" style="border-top-color:#fff; margin-right:6px;"></span> 返回中...';

      // 延迟 400ms 后跳转
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 400);
    });
  });
</script>
</body>
</html>
