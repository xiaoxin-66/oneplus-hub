<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>获取密钥 - 满天星</title>
<style>
@property --angle {
  syntax: '<angle>';
  initial-value: 0deg;
  inherits: true;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --angle: 0deg;
  --text: #eef2ff;
  --muted: rgba(214, 226, 255, .46);
}

html, body { height: 100%; }

body {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: safe center;
  justify-content: safe center;
  padding: 15px 12px;
  font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  color: var(--text);
  background: #04060a;
  background-image: radial-gradient(circle at 50% 0%, #0d1425 0%, #04060a 100%);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

/* 闪烁星空背景 */
.stars {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background-image: 
    radial-gradient(1.5px 1.5px at 20px 30px, #fff, rgba(0,0,0,0)),
    radial-gradient(1px 1px at 40px 70px, #fff, rgba(0,0,0,0)),
    radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
    radial-gradient(1.5px 1.5px at 160px 120px, #fff, rgba(0,0,0,0));
  background-repeat: repeat;
  background-size: 200px 150px;
  animation: twinkle 4s infinite alternate;
}
@keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

.orb {
  position: fixed; z-index: 1; border-radius: 50%;
  filter: blur(100px); pointer-events: none; opacity: .15;
}
.orb-1 { width: 350px; height: 350px; background: #eab308; top: -100px; right: -100px; opacity: 0.1; }
.orb-2 { width: 350px; height: 350px; background: #8b3bff; bottom: -100px; left: -100px; }

/* 主卡片 */
.card {
  position: relative;
  z-index: 10;
  width: 100%;
  max-width: 360px;
  padding: 2.5px;
  border-radius: 22px;
  background: conic-gradient(from var(--angle),
    #eab308, #ff4d6d 22%, #8b5cf6 42%, #2f6bff 58%, #eab308 78%, #eab308 100%);
  overflow: hidden;
  animation: spin 8s linear infinite, glowPulse 3s infinite alternate;
  transform: translateZ(0);
  will-change: transform;
}

@keyframes spin { to { --angle: 360deg; } }
@keyframes glowPulse {
  0% { box-shadow: 0 20px 60px -20px rgba(0, 0, 0, .9), 0 0 25px -5px rgba(234, 179, 8, .3); }
  100% { box-shadow: 0 20px 60px -20px rgba(0, 0, 0, .9), 0 0 50px 10px rgba(234, 179, 8, .6); }
}

.card-inner {
  position: relative;
  isolation: isolate;
  padding: 30px 20px 24px;
  border-radius: 19.5px;
  overflow: hidden;
  background: rgba(13, 18, 30, 0.92); 
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  transform: translateZ(0);
  text-align: center;
}

/* 图标 + 呼吸灯 */
.icon {
  position: relative;
  width: 54px; height: 54px;
  margin: 0 auto 16px;
  border-radius: 16px;
  display: grid; place-items: center;
  background: rgba(234, 179, 8, 0.12);
  border: 1px solid rgba(234, 179, 8, 0.3);
  color: #eab308;
  z-index: 1;
}

.icon::before {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 20px;
  background: #eab308;
  filter: blur(10px);
  z-index: -1;
  animation: iconPulse 2s infinite alternate;
}

@keyframes iconPulse {
  0% { opacity: 0.2; transform: scale(0.9); }
  100% { opacity: 0.6; transform: scale(1.1); }
}

h2 { margin-bottom: 6px; font-size: 20px; font-weight: 800; letter-spacing: 1px; color: #fff; }
p { margin-bottom: 20px; font-size: 12px; color: var(--muted); line-height: 1.5; }

/* 二维码相框 */
.qr-container {
  position: relative;
  display: inline-block;
  margin-bottom: 20px;
  padding: 2px;
  border-radius: 16px;
  background: linear-gradient(135deg, #8b5cf6, #29b6f6, #eab308); 
  box-shadow: 0 8px 25px rgba(0,0,0,0.5), 0 0 20px rgba(139, 92, 246, 0.3);
  animation: float 4s ease-in-out infinite;
}
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

.qr-wrap {
  position: relative;
  background: #fff;
  padding: 8px;
  border-radius: 14px;
  overflow: hidden;
  width: 200px;
  height: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.qr-wrap img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: 8px;
}

/* 扫描线 */
.scan-line {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 2px;
  background: linear-gradient(90deg, transparent, #8b5cf6, #eab308, transparent);
  box-shadow: 0 0 10px #8b5cf6;
  animation: scan 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  z-index: 10;
}
@keyframes scan {
  0% { top: -5%; opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { top: 105%; opacity: 0; }
}

/* 返回首页 */
.back-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.05);
  color: rgba(255, 255, 255, 0.8);
  border: 1px solid rgba(255, 255, 255, 0.1);
  font-size: 13px;
  font-weight: bold;
  text-decoration: none;
  transition: all 0.3s;
}
.back-btn:hover {
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
  transform: translateY(-2px);
}
</style>
</head>
<body>

<div class="stars" aria-hidden="true"></div>
<div class="orb orb-1" aria-hidden="true"></div>
<div class="orb orb-2" aria-hidden="true"></div>

<main class="card">
  <div class="card-inner">
    <div class="icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>
      </svg>
    </div>
    <h2>获取密钥</h2>
    <p>扫描下方二维码联系管理员<br>购买并获取验证密钥</p>
    
    <div class="qr-container">
      <div class="qr-wrap">
        <img src="qrcode.jpg?v=3" alt="扫码获取密钥">
        <div class="scan-line"></div>
      </div>
    </div>
    
    <a href="index.html" class="back-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
      返回首页
    </a>
  </div>
</main>

<script>
  // 防审查元素
  (function() {
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'F12' || e.keyCode === 123) { e.preventDefault(); return false; }
      if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'C' || e.key === 'c' || e.key === 'J' || e.key === 'j')) {
        e.preventDefault(); return false;
      }
      if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) { e.preventDefault(); return false; }
    });
  })();
</script>
</body>
</html>
