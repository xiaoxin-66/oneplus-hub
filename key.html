<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>获取密钥 - 满天星</title>
<link rel="stylesheet" href="common.css">
<style>
.card-inner { padding: 36px 24px 28px; text-align: center; }
.icon { position: relative; width: 60px; height: 60px; margin: 0 auto 20px; border-radius: 18px; display: grid; place-items: center; background: rgba(234,179,8,.15); border: 1px solid rgba(255,255,255,.1); color: #eab308; z-index: 1; }
.icon::before { content: ''; position: absolute; inset: -6px; border-radius: 24px; background: #eab308; filter: blur(12px); z-index: -1; animation: iconPulse 2s infinite alternate; }
@keyframes iconPulse { 0% { opacity: .15; transform: scale(.9); } 100% { opacity: .4; transform: scale(1.1); } }
h2 { margin-bottom: 8px; font-size: 22px; font-weight: 800; color: #fff; }
p { margin-bottom: 24px; font-size: 13px; color: rgba(255,255,255,0.6); line-height: 1.6; }

.qr-container { position: relative; display: inline-block; margin-bottom: 24px; padding: 3px; border-radius: 20px; background: linear-gradient(135deg, #8b5cf6, #29b6f6, #eab308); animation: float 5s ease-in-out infinite; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.qr-wrap { position: relative; background: #fff; padding: 10px; border-radius: 17px; overflow: hidden; width: 210px; height: 210px; display: flex; align-items: center; justify-content: center; }
.qr-wrap img { display: block; width: 100%; height: 100%; object-fit: contain; border-radius: 10px; }
.scan-line { position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, transparent, #8b5cf6, #eab308, transparent); animation: scan 3s cubic-bezier(0.4, 0, 0.2, 1) infinite; z-index: 10; }
@keyframes scan { 0% { top: -5%; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 105%; opacity: 0; } }

.back-btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 14px; border-radius: 14px; background: rgba(255,255,255,.08); color: rgba(255,255,255,.8); border: 1px solid rgba(255,255,255,.1); font-size: 14px; font-weight: bold; text-decoration: none; cursor: pointer; transition: transform 0.2s; }
.back-btn:active { transform: scale(0.96); }

.btn-loading { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: btnSpin 0.6s linear infinite; margin-right: 6px; }
@keyframes btnSpin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="nebula"></div>
<div class="stars"></div>
<div class="planet" id="planet-bg"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<main class="card">
  <div class="card-inner">
    <div class="icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path></svg>
    </div>
    <h2>获取密钥</h2>
    <p>扫描下方二维码联系管理员<br>购买并获取验证密钥</p>

    <div class="qr-container">
      <div class="qr-wrap">
        <img src="qrcode.jpg?v=3" alt="扫码联系管理员获取密钥" loading="lazy" width="190" height="190">
        <div class="scan-line"></div>
      </div>
    </div>

    <a href="index.html" class="back-btn" id="backBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="15 18 9 12 15 6"></polyline></svg>
      返回首页
    </a>
  </div>
</main>

<script src="common.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const backBtn = document.getElementById('backBtn');
    backBtn.addEventListener('click', function(e) {
      if (this.dataset.loading) return;
      e.preventDefault();
      this.dataset.loading = "true";
      this.innerHTML = '<span class="btn-loading"></span> 加载中...';
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 50);
    });
  });
</script>
</body>
</html>
