<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SukiSU 验证</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: radial-gradient(circle at 50% 0%, #0d1425 0%, #04060a 100%);
  color: #eef2ff;
  font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  padding: 20px;
  overflow: hidden;
}

/* 满天星背景 */
.stars {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: 
    radial-gradient(1.5px 1.5px at 20px 30px, #fff, rgba(0,0,0,0)),
    radial-gradient(1px 1px at 40px 70px, #fff, rgba(0,0,0,0)),
    radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
    radial-gradient(1.5px 1.5px at 160px 120px, #fff, rgba(0,0,0,0)),
    radial-gradient(1px 1px at 230px 80px, #fff, rgba(0,0,0,0));
  background-repeat: repeat;
  background-size: 300px 200px;
  animation: twinkle 4s infinite alternate;
}
@keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.8; } }

/* 背景光晕 */
.orb {
  position: fixed; border-radius: 50%; filter: blur(120px);
  pointer-events: none; z-index: 0; opacity: .15;
}
.orb-1 { width: 350px; height: 350px; background: #2f6bff; top: -100px; left: -100px; }
.orb-2 { width: 350px; height: 350px; background: #8b3bff; bottom: -100px; right: -100px; }

/* 毛玻璃卡片 */
.card {
  position: relative;
  z-index: 1;
  background: rgba(13, 18, 30, 0.85);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  padding: 35px 25px;
  border-radius: 24px;
  width: 100%;
  max-width: 360px;
  text-align: center;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.15);
  animation: slideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* 顶部图标 */
.icon {
  width: 64px; height: 64px;
  margin: 0 auto 16px;
  border-radius: 20px;
  display: grid; place-items: center;
  background: rgba(59, 157, 255, 0.1);
  border: 1px solid rgba(59, 157, 255, 0.3);
  color: #3b9dff;
  box-shadow: 0 0 20px rgba(59, 157, 255, 0.15);
  animation: iconPulse 3s infinite alternate;
}
@keyframes iconPulse {
  from { box-shadow: 0 0 10px rgba(59, 157, 255, 0.1); }
  to { box-shadow: 0 0 30px rgba(59, 157, 255, 0.5); }
}

h2 { margin-bottom: 8px; font-size: 22px; font-weight: 800; letter-spacing: 1px; color: #fff; }
p { margin-bottom: 24px; font-size: 13px; color: rgba(214, 226, 255, 0.6); line-height: 1.5; }

/* 输入框 */
.input-group { margin-bottom: 8px; }
input {
  width: 100%;
  padding: 15px;
  border-radius: 14px;
  background: rgba(0, 0, 0, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: #fff;
  font-size: 16px;
  text-align: center;
  outline: none;
  transition: all 0.3s;
  font-family: inherit;
  letter-spacing: 2px;
}
input::placeholder { letter-spacing: normal; color: rgba(255, 255, 255, 0.35); }
input:focus { border-color: #3b9dff; box-shadow: 0 0 15px rgba(59, 157, 255, 0.3); background: rgba(0, 0, 0, 0.7); }

/* 错误提示及倒计时 */
.err {
  color: #ff4d4d; font-size: 12px;
  height: 18px; margin-bottom: 12px;
  opacity: 0; transition: opacity 0.3s;
}
.err.show { opacity: 1; }
.shake { animation: shake 0.4s ease-in-out; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

/* 按钮 */
button {
  width: 100%;
  padding: 15px;
  border-radius: 14px;
  background: linear-gradient(135deg, #3b9dff, #2f6bff);
  color: #fff;
  border: none;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 8px 20px rgba(59, 157, 255, 0.3);
  margin-bottom: 24px;
}
button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(59, 157, 255, 0.5); }
button:active:not(:disabled) { transform: translateY(0); }

/* 禁用状态下的按钮和输入框 */
button:disabled {
  background: #2a3245;
  color: rgba(255, 255, 255, 0.3);
  box-shadow: none;
  cursor: not-allowed;
}
input:disabled {
  background: rgba(0, 0, 0, 0.8);
  color: rgba(255, 255, 255, 0.3);
  border-color: rgba(255, 255, 255, 0.05);
  cursor: not-allowed;
}

/* 返回首页按钮 */
.back-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  color: rgba(214, 226, 255, 0.5);
  text-decoration: none;
  font-size: 13px;
  padding: 8px 16px;
  border-radius: 100px;
  background: rgba(255, 255, 255, 0.03);
  transition: all 0.3s;
}
.back-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.1); }
</style>
</head>
<body>
<div class="stars"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="card" id="card">
  <div class="icon">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
    </svg>
  </div>
  <h2>SukiSU 验证</h2>
  <p>该资源为付费内容<br>请输入您购买后获取的密钥</p>
  
  <div class="input-group">
    <input type="password" id="pass" placeholder="请输入密钥" autocomplete="off">
  </div>
  
  <!-- 错误与倒计时提示 -->
  <div class="err" id="err"></div>
  
  <button id="verifyBtn" onclick="verify()">验证并前往下载</button>
  
  <a href="index.html" class="back-btn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    返回首页
  </a>
</div>

<script>
// ================= 配置区 =================
const MAX_TRIES = 5;            // 最多允许错误次数
const LOCK_TIME = 10 * 60 * 1000; // 锁定时间：10分钟（单位毫秒）
// ==========================================

const passInput = document.getElementById('pass');
const verifyBtn = document.getElementById('verifyBtn');
const errText = document.getElementById('err');
const card = document.getElementById('card');
let timerInterval = null;

// 页面加载时，检查是否处于锁定状态
window.onload = function() {
  checkLockStatus();
};

function verify() {
  const val = passInput.value.trim();
  if(!val) return;

  // 将用户输入的内容进行加密（每个字符的 ASCII 码 + 2）
  const enc = val.split('').map(c => String.fromCharCode(c.charCodeAt(0) + 2)).join('');
  
  // 验证逻辑："H70528" -> "J9274:"
  if (enc === "J9274:") {
    // 验证成功，清除错误记录
    localStorage.removeItem('suki_fail_count');
    localStorage.removeItem('suki_lock_until');
    // 直接跳转
    window.location.href = "https://www.123684.com/s/YXhyVv-kcWsH";
  } else {
    // 验证失败逻辑
    handleFail();
  }
}

function handleFail() {
  // 获取当前错误次数
  let failCount = parseInt(localStorage.getItem('suki_fail_count') || '0');
  failCount++;
  localStorage.setItem('suki_fail_count', failCount);

  // 计算剩余次数
  const remain = MAX_TRIES - failCount;

  // 抖动特效
  card.classList.add('shake');
  setTimeout(() => { card.classList.remove('shake'); }, 400);

  if (failCount >= MAX_TRIES) {
    // 次数用尽，触发锁定
    const lockUntil = Date.now() + LOCK_TIME;
    localStorage.setItem('suki_lock_until', lockUntil);
    checkLockStatus();
  } else {
    // 未达上限，提示剩余次数
    showError(`密钥错误，您还有 ${remain} 次尝试机会`);
    passInput.value = '';
    passInput.focus();
  }
}

function showError(msg) {
  errText.innerText = msg;
  errText.classList.add('show');
}

function checkLockStatus() {
  const lockUntil = localStorage.getItem('suki_lock_until');
  
  if (lockUntil && Date.now() < lockUntil) {
    // 处于锁定状态
    passInput.disabled = true;
    verifyBtn.disabled = true;
    
    // 启动倒计时
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      const now = Date.now();
      const left = lockUntil - now;
      
      if (left <= 0) {
        // 倒计时结束，解除锁定
        clearInterval(timerInterval);
        localStorage.removeItem('suki_fail_count');
        localStorage.removeItem('suki_lock_until');
        unlockInputs();
      } else {
        // 更新倒计时文字 (分:秒)
        const m = Math.floor(left / 60000);
        const s = Math.floor((left % 60000) / 1000);
        showError(`错误次数过多，请 ${m}分${s < 10 ? '0'+s : s}秒 后重试`);
      }
    }, 1000);
  } else {
    // 未锁定状态，清理过期记录
    if (lockUntil) {
      localStorage.removeItem('suki_fail_count');
      localStorage.removeItem('suki_lock_until');
    }
    unlockInputs();
  }
}

function unlockInputs() {
  passInput.disabled = false;
  verifyBtn.disabled = false;
  errText.classList.remove('show');
  passInput.value = '';
}

// 监听输入事件，用户重新输入时隐藏错误提示
passInput.addEventListener('input', () => {
  errText.classList.remove('show');
});

// 监听回车键
passInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !verifyBtn.disabled) {
    verify();
  }
});
</script>
</body>
</html>
