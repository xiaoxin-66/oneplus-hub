<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SukiSU 验证</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: radial-gradient(circle at 50% 0%, #0d1425 0%, #04060a 100%);
  color: #eef2ff;
  font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  padding: 20px;
  overflow: hidden;
}

/* 满天星背景 */
.stars {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: 
    radial-gradient(1.5px 1.5px at 20px 30px, #fff, rgba(0,0,0,0)),
    radial-gradient(1px 1px at 40px 70px, #fff, rgba(0,0,0,0)),
    radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
    radial-gradient(1.5px 1.5px at 160px 120px, #fff, rgba(0,0,0,0)),
    radial-gradient(1px 1px at 230px 80px, #fff, rgba(0,0,0,0));
  background-repeat: repeat;
  background-size: 300px 200px;
  animation: twinkle 4s infinite alternate;
}
@keyframes twinkle {
  0%, 100% { opacity: 0.2; }
  50% { opacity: 0.8; }
}

/* 背景光晕 */
.orb {
  position: fixed; border-radius: 50%; filter: blur(120px);
  pointer-events: none; z-index: 0; opacity: .15;
}
.orb-1 { width: 350px; height: 350px; background: #2f6bff; top: -100px; left: -100px; }
.orb-2 { width: 350px; height: 350px; background: #8b3bff; bottom: -100px; right: -100px; }

/* 毛玻璃卡片 */
.card {
  position: relative;
  z-index: 1;
  background: rgba(13, 18, 30, 0.85);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  padding: 35px 25px;
  border-radius: 24px;
  width: 100%;
  max-width: 360px;
  text-align: center;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.15);
  animation: slideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* 顶部图标 */
.icon {
  width: 64px; height: 64px;
  margin: 0 auto 16px;
  border-radius: 20px;
  display: grid; place-items: center;
  background: rgba(59, 157, 255, 0.1);
  border: 1px solid rgba(59, 157, 255, 0.3);
  color: #3b9dff;
  box-shadow: 0 0 20px rgba(59, 157, 255, 0.15);
  animation: iconPulse 3s infinite alternate;
}
@keyframes iconPulse {
  from { box-shadow: 0 0 10px rgba(59, 157, 255, 0.1); }
  to { box-shadow: 0 0 30px rgba(59, 157, 255, 0.5); }
}

/* 标题加入一个隐藏的点击生成功能 */
h2 { margin-bottom: 8px; font-size: 22px; font-weight: 800; letter-spacing: 1px; color: #fff; cursor: pointer; user-select: none; }
p { margin-bottom: 24px; font-size: 13px; color: rgba(214, 226, 255, 0.6); line-height: 1.5; }

/* 输入框 */
.input-group { margin-bottom: 8px; }
input {
  width: 100%;
  padding: 15px;
  border-radius: 14px;
  background: rgba(0, 0, 0, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: #fff;
  font-size: 16px;
  text-align: center;
  outline: none;
  transition: all 0.3s;
  font-family: inherit;
  letter-spacing: 2px;
}
input::placeholder { letter-spacing: normal; color: rgba(255, 255, 255, 0.35); }
input:focus { border-color: #3b9dff; box-shadow: 0 0 15px rgba(59, 157, 255, 0.3); background: rgba(0, 0, 0, 0.7); }

/* 错误提示 */
.err {
  color: #ff4d4d; font-size: 12px;
  height: 18px; margin-bottom: 12px;
  opacity: 0; transition: opacity 0.3s;
}
.err.show { opacity: 1; }
.shake { animation: shake 0.4s ease-in-out; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

/* 按钮 */
button {
  width: 100%;
  padding: 15px;
  border-radius: 14px;
  background: linear-gradient(135deg, #3b9dff, #2f6bff);
  color: #fff;
  border: none;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 8px 20px rgba(59, 157, 255, 0.3);
  margin-bottom: 24px;
}
button:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(59, 157, 255, 0.5); }
button:active { transform: translateY(0); }

/* 返回首页按钮 */
.back-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  color: rgba(214, 226, 255, 0.5);
  text-decoration: none;
  font-size: 13px;
  padding: 8px 16px;
  border-radius: 100px;
  background: rgba(255, 255, 255, 0.03);
  transition: all 0.3s;
}
.back-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.1); }
</style>
</head>
<body>
<div class="stars"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="card" id="card">
  <div class="icon">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
    </svg>
  </div>
  <!-- 双击这个标题可以生成密钥 -->
  <h2 id="titleText">SukiSU 验证</h2>
  <p>该资源为付费内容<br>请输入您购买后获取的密钥</p>
  
  <div class="input-group">
    <input type="password" id="pass" placeholder="请输入密钥" autocomplete="off">
  </div>
  <div class="err" id="err">密钥错误，请重新输入</div>
  
  <button onclick="verify()">验证并前往下载</button>
  
  <a href="index.html" class="back-btn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    返回首页
  </a>
</div>

<script>
// 👇【你的加密密钥池】你可以往数组里无限添加新的加密字符串
// 加密版 J9274:
const VALID_ENCRYPTED_KEYS = [
  "J9274:"
  "J:41;23" 
];

function verify() {
  const val = document.getElementById('pass').value.trim();
  if(!val) return;
  
  // 将用户输入的明文转为密文
  const enc = val.split('').map(c => String.fromCharCode(c.charCodeAt(0) + 2)).join('');
  
  // 如果密文在数组中存在，就通过
  if (VALID_ENCRYPTED_KEYS.includes(enc)) {
    window.location.href = "https://www.123684.com/s/YXhyVv-kcWsH";
  } else {
    const err = document.getElementById('err');
    const card = document.getElementById('card');
    err.classList.add('show');
    card.classList.add('shake');
    setTimeout(() => { card.classList.remove('shake'); }, 400);
  }
}

document.getElementById('pass').addEventListener('input', () => {
  document.getElementById('err').classList.remove('show');
});

// ==========================================
// 👇 【管理员隐藏功能】生成随机密钥
// 操作：在手机上连续点击两次（或双击）"SukiSU 验证"这几个字
// ==========================================
let clickCount = 0;
let clickTimer = null;

document.getElementById('titleText').addEventListener('click', function() {
  clickCount++;
  if (clickCount === 2) {
    // 生成一个 6 位随机密钥 (例如 H83921)
    const randomNum = Math.floor(10000 + Math.random() * 90000);
    const newKey = `H${randomNum}`;
    
    // 加密这个新密钥
    const encryptedKey = newKey.split('').map(c => String.fromCharCode(c.charCodeAt(0) + 2)).join('');
    
    // 弹窗告诉管理员
    alert(`✅ 已生成新密钥！\n\n明文（发给买家）：${newKey}\n\n复制下面这串代码，加到源码的 VALID_ENCRYPTED_KEYS 数组里才能生效：\n"${encryptedKey}"`);
    
    clickCount = 0;
  }
  clearTimeout(clickTimer);
  clickTimer = setTimeout(() => { clickCount = 0; }, 500); // 500ms内点两次生效
});
</script>
</body>
</html>
