<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SukiSU 验证 - 满天星</title>
<style>
@property --angle {
  syntax: '<angle>';
  initial-value: 0deg;
  inherits: true;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --angle: 0deg;
  --text: #eef2ff;
  --muted: rgba(214, 226, 255, .46);
}

html, body { height: 100%; }

body {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: safe center;
  justify-content: safe center;
  padding: 15px 12px;
  font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  color: var(--text);
  background: #04060a;
  background-image: radial-gradient(circle at 50% 0%, #0d1425 0%, #04060a 100%);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

/* 闪烁星空背景 */
.stars {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background-image: 
    radial-gradient(1.5px 1.5px at 20px 30px, #fff, rgba(0,0,0,0)),
    radial-gradient(1px 1px at 40px 70px, #fff, rgba(0,0,0,0)),
    radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
    radial-gradient(1.5px 1.5px at 160px 120px, #fff, rgba(0,0,0,0));
  background-repeat: repeat;
  background-size: 200px 150px;
  animation: twinkle 4s infinite alternate;
}
@keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

.orb {
  position: fixed; z-index: 1; border-radius: 50%;
  filter: blur(100px); pointer-events: none; opacity: .15;
}
.orb-1 { width: 350px; height: 350px; background: #2f6bff; top: -100px; left: -100px; }
.orb-2 { width: 350px; height: 350px; background: #8b3bff; bottom: -100px; right: -100px; }

/* 主卡片（动态流光边框） */
.card {
  position: relative;
  z-index: 10;
  width: 100%;
  max-width: 360px;
  padding: 2.5px;
  border-radius: 22px;
  background: conic-gradient(from var(--angle),
    #2f6bff, #8b5cf6 22%, #ff4d6d 42%, #ff9d3d 58%, #2f6bff 78%, #2f6bff 100%);
  box-shadow: 0 20px 60px -20px rgba(0, 0, 0, .9), 0 0 40px -20px rgba(90, 120, 255, .6);
  overflow: hidden;
  animation: spin 8s linear infinite;
  transform: translateZ(0);
  will-change: transform;
}
@keyframes spin { to { --angle: 360deg; } }

.card-inner {
  position: relative;
  isolation: isolate;
  padding: 30px 20px 24px;
  border-radius: 19.5px;
  overflow: hidden;
  background: rgba(13, 18, 30, 0.92); 
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  transform: translateZ(0);
  text-align: center;
}

/* 图标 */
.icon {
  width: 54px; height: 54px;
  margin: 0 auto 16px;
  border-radius: 16px;
  display: grid; place-items: center;
  background: rgba(59, 157, 255, 0.12);
  border: 1px solid rgba(59, 157, 255, 0.3);
  color: #3b9dff;
  box-shadow: 0 0 20px rgba(59, 157, 255, 0.2);
}

h2 { margin-bottom: 6px; font-size: 20px; font-weight: 800; letter-spacing: 1px; color: #fff; }
p { margin-bottom: 20px; font-size: 12px; color: var(--muted); line-height: 1.5; }

/* 输入框 */
.input-group { margin-bottom: 6px; }
input {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: #fff;
  font-size: 15px;
  text-align: center;
  outline: none;
  transition: all 0.3s;
  font-family: inherit;
  letter-spacing: 2px;
}
input::placeholder { letter-spacing: normal; color: rgba(255, 255, 255, 0.3); }
input:focus { border-color: #3b9dff; box-shadow: 0 0 15px rgba(59, 157, 255, 0.3); }

/* 错误提示 */
.err {
  color: #ff4d4d; font-size: 11.5px;
  height: 18px; margin-bottom: 12px;
  opacity: 0; transition: opacity 0.3s;
}
.err.show { opacity: 1; }
.shake { animation: shake 0.4s ease-in-out; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}

/* 按钮 */
button {
  width: 100%;
  padding: 13px;
  border-radius: 12px;
  background: linear-gradient(135deg, #3b9dff, #2f6bff);
  color: #fff;
  border: none;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 6px 15px rgba(59, 157, 255, 0.3);
  margin-bottom: 20px;
}
button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(59, 157, 255, 0.5); }
button:disabled { background: #2a3245; color: rgba(255, 255, 255, 0.3); box-shadow: none; cursor: not-allowed; }

/* 返回首页 */
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: rgba(214, 226, 255, 0.5);
  text-decoration: none;
  font-size: 12px;
  padding: 6px 12px;
  border-radius: 100px;
  background: rgba(255, 255, 255, 0.04);
  transition: all 0.3s;
}
.back-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.1); }
</style>
</head>
<body>

<div class="stars" aria-hidden="true"></div>
<div class="orb orb-1" aria-hidden="true"></div>
<div class="orb orb-2" aria-hidden="true"></div>

<main class="card">
  <div class="card-inner" id="card">
    <div class="icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>
    <h2>SukiSU 验证</h2>
    <p>该资源为付费内容<br>请输入您购买后获取的密钥</p>
    
    <div class="input-group">
      <input type="password" id="pass" placeholder="请输入密钥" autocomplete="off">
    </div>
    <div class="err" id="err"></div>
    
    <button id="verifyBtn" onclick="verify()">验证并前往下载</button>
    
    <a href="index.html" class="back-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
      返回首页
    </a>
  </div>
</main>

<script>
  const MAX_TRIES = 5;
  const LOCK_TIME = 10 * 60 * 1000;
  const passInput = document.getElementById('pass');
  const verifyBtn = document.getElementById('verifyBtn');
  const errText = document.getElementById('err');
  const card = document.getElementById('card');
  let timerInterval = null;

  window.onload = function() { checkLockStatus(); };

  function verify() {
    const val = passInput.value.trim();
    if(!val) return;
    const enc = val.split('').map(c => String.fromCharCode(c.charCodeAt(0) + 2)).join('');
    
    if (enc === "J9274:") {
      localStorage.removeItem('suki_fail_count');
      localStorage.removeItem('suki_lock_until');
      window.location.href = "https://www.123684.com/s/YXhyVv-kcWsH";
    } else {
      handleFail();
    }
  }

  function handleFail() {
    let failCount = parseInt(localStorage.getItem('suki_fail_count') || '0');
    failCount++;
    localStorage.setItem('suki_fail_count', failCount);
    const remain = MAX_TRIES - failCount;

    card.classList.add('shake');
    setTimeout(() => { card.classList.remove('shake'); }, 400);

    if (failCount >= MAX_TRIES) {
      const lockUntil = Date.now() + LOCK_TIME;
      localStorage.setItem('suki_lock_until', lockUntil);
      checkLockStatus();
    } else {
      showError(`密钥错误，您还有 ${remain} 次尝试机会`);
      passInput.value = '';
      passInput.focus();
    }
  }

  function showError(msg) {
    errText.innerText = msg;
    errText.classList.add('show');
  }

  function checkLockStatus() {
    const lockUntil = localStorage.getItem('suki_lock_until');
    if (lockUntil && Date.now() < lockUntil) {
      passInput.disabled = true;
      verifyBtn.disabled = true;
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const now = Date.now();
        const left = lockUntil - now;
        if (left <= 0) {
          clearInterval(timerInterval);
          localStorage.removeItem('suki_fail_count');
          localStorage.removeItem('suki_lock_until');
          unlockInputs();
        } else {
          const m = Math.floor(left / 60000);
          const s = Math.floor((left % 60000) / 1000);
          showError(`错误次数过多，请 ${m}分${s < 10 ? '0'+s : s}秒 后重试`);
        }
      }, 1000);
    } else {
      if (lockUntil) {
        localStorage.removeItem('suki_fail_count');
        localStorage.removeItem('suki_lock_until');
      }
      unlockInputs();
    }
  }

  function unlockInputs() {
    passInput.disabled = false;
    verifyBtn.disabled = false;
    errText.classList.remove('show');
    passInput.value = '';
  }

  passInput.addEventListener('input', () => { errText.classList.remove('show'); });
  passInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !verifyBtn.disabled) verify(); });

  // 防审查元素
  (function() {
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'F12' || e.keyCode === 123) { e.preventDefault(); return false; }
      if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'C' || e.key === 'c' || e.key === 'J' || e.key === 'j')) {
        e.preventDefault(); return false;
      }
      if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) { e.preventDefault(); return false; }
    });
  })();
</script>
</body>
</html>
