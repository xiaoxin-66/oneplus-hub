<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SukiSU 验证 - 满天星</title>
<link rel="stylesheet" href="common.css">
<style>
/* 这里包含了 suki.html 独有的样式 */
.card-inner { padding: 30px 20px 24px; text-align: center; }

.icon {
  position: relative;
  width: 54px; height: 54px;
  margin: 0 auto 16px;
  border-radius: 16px;
  display: grid; place-items: center;
  background: rgba(59,157,255,.12);
  border: 1px solid rgba(59,157,255,.3);
  color: #3b9dff;
  z-index: 1;
}
.icon::before {
  content: '';
  position: absolute; inset: -4px;
  border-radius: 20px;
  background: #3b9dff;
  filter: blur(10px);
  z-index: -1;
  animation: iconPulse 2s infinite alternate;
}
@keyframes iconPulse {
  0% { opacity: .2; transform: scale(.9); }
  100% { opacity: .6; transform: scale(1.1); }
}

h2 { margin-bottom: 6px; font-size: 20px; font-weight: 800; letter-spacing: 1px; color: #fff; }
p { margin-bottom: 20px; font-size: 12px; color: var(--muted); line-height: 1.5; }

.input-group { position: relative; margin-bottom: 6px; }
input {
  width: 100%;
  padding: 12px 44px 12px 12px;
  border-radius: 12px;
  background: rgba(0,0,0,.4);
  border: 1px solid rgba(255,255,255,.1);
  color: #fff;
  font-size: 15px;
  text-align: center;
  outline: none;
  transition: border-color .3s, box-shadow .3s;
  font-family: inherit;
  letter-spacing: 2px;
}
input::placeholder { letter-spacing: normal; color: rgba(255,255,255,.3); }
input:focus { border-color: #3b9dff; box-shadow: 0 0 15px rgba(59,157,255,.3); }

.eye {
  position: absolute;
  right: 8px; top: 50%;
  transform: translateY(-50%);
  width: 30px; height: 30px;
  display: grid; place-items: center;
  background: transparent;
  border: none;
  color: rgba(255,255,255,.4);
  cursor: pointer;
  border-radius: 8px;
  transition: color .2s, background .2s;
}
.eye:hover { color: #fff; background: rgba(255,255,255,.08); }
.eye svg { width: 16px; height: 16px; }

.err {
  color: #ff4d4d; font-size: 11.5px;
  height: 18px; margin-bottom: 12px;
  opacity: 0; transition: opacity .3s;
}
.err.show { opacity: 1; }

button.verify {
  width: 100%;
  padding: 13px;
  border-radius: 12px;
  background: linear-gradient(135deg, #3b9dff, #2f6bff);
  color: #fff;
  border: none;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  transition: transform .3s, box-shadow .3s;
  box-shadow: 0 6px 15px rgba(59,157,255,.3);
  margin-bottom: 20px;
}
button.verify:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(59,157,255,.5); }
button.verify:disabled { background: #2a3245; color: rgba(255,255,255,.3); box-shadow: none; cursor: not-allowed; }

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: rgba(214,226,255,.5);
  text-decoration: none;
  font-size: 12px;
  padding: 6px 12px;
  border-radius: 100px;
  background: rgba(255,255,255,.04);
  transition: color .3s, background .3s;
}
.back-btn:hover { color: #fff; background: rgba(255,255,255,.1); }
</style>
</head>
<body>

<div class="stars" aria-hidden="true"></div>
<div class="orb orb-1" aria-hidden="true"></div>
<div class="orb orb-2" aria-hidden="true"></div>

<main class="card">
  <div class="card-inner" id="card">
    <div class="icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>
    <h2>SukiSU 验证</h2>
    <p>该资源为付费内容<br>请输入您购买后获取的密钥</p>

    <div class="input-group">
      <input type="password" id="pass" placeholder="请输入密钥" autocomplete="off" aria-describedby="err">
      <button type="button" class="eye" id="eyeBtn" aria-label="显示或隐藏密钥">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>
    </div>
    <div class="err" id="err" role="alert"></div>

    <button class="verify" id="verifyBtn" onclick="verify()">验证并前往下载</button>

    <a href="index.html" class="back-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
      返回首页
    </a>
  </div>
</main>

<script src="common.js"></script>
<script>
/* ===== 已填入你生成的加密常量 ===== */
const KEY_HASH   = "9c782df6bb1e8a69d4b9eb634b0a4c5b9d90c94bc9e6d5937c453bdc10f94911";
const SALT_B64   = "iqGAeOq8QGU+C7Rq4rGDRQ==";
const IV_B64     = "0Q2eZRMpwpICKHlY";
const CIPHER_B64 = "xdkOAYpA5rQjpd8+2TW9MkuADp0L3NSXFMSeRGwzYXVAi5+rELrt5JDD70/2rJ2CT7FlEzA=";
/* ======================================= */

const MAX_TRIES = 5;
const LOCK_TIME = 10 * 60 * 1000;
const passInput = document.getElementById('pass');
const verifyBtn = document.getElementById('verifyBtn');
const errText = document.getElementById('err');
const card = document.getElementById('card');
const eyeBtn = document.getElementById('eyeBtn');
let timerInterval = null;

window.addEventListener('load', checkLockStatus);

eyeBtn.addEventListener('click', () => {
  passInput.type = passInput.type === 'password' ? 'text' : 'password';
  passInput.focus();
});

const b64ToU8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const u8ToHex = u8 => [...u8].map(b => b.toString(16).padStart(2, '0')).join('');

async function verify() {
  const val = passInput.value.trim();
  if (!val) return;
  verifyBtn.disabled = true;

  try {
    const enc = new TextEncoder();
    const digest = await crypto.subtle.digest('SHA-256', enc.encode(val));
    if (u8ToHex(new Uint8Array(digest)) !== KEY_HASH) { handleFail(); return; }

    const baseKey = await crypto.subtle.importKey('raw', enc.encode(val), 'PBKDF2', false, ['deriveKey']);
    const aesKey = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64ToU8(SALT_B64), iterations: 100000, hash: 'SHA-256' },
      baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
    );
    const pt = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: b64ToU8(IV_B64) },
      aesKey, b64ToU8(CIPHER_B64)
    );
    const url = new TextDecoder().decode(pt);

    localStorage.removeItem('suki_fail_count');
    localStorage.removeItem('suki_lock_until');
    window.location.replace(url);
  } catch (e) {
    handleFail();
  } finally {
    verifyBtn.disabled = false;
  }
}

function handleFail() {
  let failCount = parseInt(localStorage.getItem('suki_fail_count') || '0') + 1;
  localStorage.setItem('suki_fail_count', failCount);
  const remain = MAX_TRIES - failCount;

  card.classList.add('shake');
  setTimeout(() => card.classList.remove('shake'), 400);

  if (failCount >= MAX_TRIES) {
    localStorage.setItem('suki_lock_until', Date.now() + LOCK_TIME);
    checkLockStatus();
  } else {
    showError(`密钥错误，您还有 ${remain} 次尝试机会`);
    passInput.value = '';
    passInput.focus();
  }
}

function showError(msg) { errText.innerText = msg; errText.classList.add('show'); }

function checkLockStatus() {
  const lockUntil = localStorage.getItem('suki_lock_until');
  if (lockUntil && Date.now() < lockUntil) {
    passInput.disabled = true;
    verifyBtn.disabled = true;
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      const left = lockUntil - Date.now();
      if (left <= 0) {
        clearInterval(timerInterval);
        localStorage.removeItem('suki_fail_count');
        localStorage.removeItem('suki_lock_until');
        unlockInputs();
      } else {
        const m = Math.floor(left / 60000);
        const s = Math.floor((left % 60000) / 1000);
        showError(`错误次数过多，请 ${m}分${s < 10 ? '0'+s : s}秒 后重试`);
      }
    }, 1000);
  } else {
    if (lockUntil) {
      localStorage.removeItem('suki_fail_count');
      localStorage.removeItem('suki_lock_until');
    }
    unlockInputs();
  }
}

function unlockInputs() {
  passInput.disabled = false;
  verifyBtn.disabled = false;
  errText.classList.remove('show');
  passInput.value = '';
}

passInput.addEventListener('input', () => errText.classList.remove('show'));
passInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !verifyBtn.disabled) verify(); });
</script>
</body>
</html>
