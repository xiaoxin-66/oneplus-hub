<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SukiSU 验证</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: radial-gradient(circle at 50% 0%, #111827 0%, #03050a 100%);
  color: #eef2ff;
  font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  padding: 20px;
  overflow: hidden;
}

/* 满天星背景 */
.stars {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: 
    radial-gradient(1.5px 1.5px at 20px 30px, #fff, rgba(0,0,0,0)),
    radial-gradient(1px 1px at 40px 70px, #fff, rgba(0,0,0,0)),
    radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
    radial-gradient(1.5px 1.5px at 160px 120px, #fff, rgba(0,0,0,0)),
    radial-gradient(1px 1px at 230px 80px, #fff, rgba(0,0,0,0));
  background-repeat: repeat;
  background-size: 300px 200px;
  animation: twinkle 4s infinite alternate;
}
@keyframes twinkle {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}

/* 背景光晕 */
.orb {
  position: fixed; border-radius: 50%; filter: blur(100px);
  pointer-events: none; z-index: 0; opacity: .4;
}
.orb-1 { width: 350px; height: 350px; background: #2f6bff; top: -100px; left: -100px; }
.orb-2 { width: 350px; height: 350px; background: #8b3bff; bottom: -100px; right: -100px; }

/* 毛玻璃卡片 */
.card {
  position: relative;
  z-index: 1;
  background: rgba(15, 23, 42, 0.65);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  padding: 35px 25px;
  border-radius: 24px;
  width: 100%;
  max-width: 360px;
  text-align: center;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.15);
  animation: slideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* 顶部图标（呼吸发光） */
.icon {
  width: 60px; height: 60px;
  margin: 0 auto 16px;
  border-radius: 18px;
  display: grid; place-items: center;
  background: rgba(59, 157, 255, 0.12);
  border: 1px solid rgba(59, 157, 255, 0.3);
  color: #3b9dff;
  box-shadow: 0 0 20px rgba(59, 157, 255, 0.2);
  animation: iconPulse 3s infinite alternate;
}
@keyframes iconPulse {
  from { box-shadow: 0 0 10px rgba(59, 157, 255, 0.2); }
  to { box-shadow: 0 0 25px rgba(59, 157, 255, 0.6); }
}

h2 { margin-bottom: 8px; font-size: 22px; font-weight: 800; letter-spacing: 1px; }
p { margin-bottom: 24px; font-size: 13px; color: rgba(214, 226, 255, 0.5); line-height: 1.5; }

/* 输入框 */
.input-group { margin-bottom: 8px; position: relative; }
input {
  width: 100%;
  padding: 15px;
  border-radius: 14px;
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: #fff;
  font-size: 16px;
  text-align: center;
  outline: none;
  transition: all 0.3s;
  font-family: inherit;
  letter-spacing: 2px;
}
input::placeholder { letter-spacing: normal; color: rgba(255, 255, 255, 0.2); }
input:focus { border-color: #3b9dff; box-shadow: 0 0 15px rgba(59, 157, 255, 0.3); background: rgba(0, 0, 0, 0.6); }

/* 错误提示 */
.err {
  color: #ff4d4d; font-size: 12px;
  height: 18px; margin-bottom: 12px;
  opacity: 0; transition: opacity 0.3s;
}
.err.show { opacity: 1; }
.shake { animation: shake 0.4s ease-in-out; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

/* 按钮 */
button {
  width: 100%;
  padding: 15px;
  border-radius: 14px;
  background: linear-gradient(135deg, #3b9dff, #2f6bff);
  color: #fff;
  border: none;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 8px 20px rgba(59, 157, 255, 0.3);
  margin-bottom: 20px;
}
button:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(59, 157, 255, 0.5); }
button:active { transform: translateY(0); }

a { color: rgba(214, 226, 255, 0.4); text-decoration: none; font-size: 13px; transition: color 0.3s; }
a:hover { color: #fff; }
</style>
</head>
<body>
<div class="stars"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="card" id="card">
  <div class="icon">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
    </svg>
  </div>
  <h2>SukiSU 验证</h2>
  <p>该资源为付费内容<br>请输入您购买后获取的密钥</p>
  
  <div class="input-group">
    <input type="password" id="pass" placeholder="请输入密钥" autocomplete="off">
  </div>
  <div class="err" id="err">密钥错误，请重新输入</div>
  
  <button onclick="verify()">验证并前往下载</button>
  <a href="index.html">返回首页</a>
</div>

<script>
function verify() {
  const val = document.getElementById('pass').value.trim();
  const enc = val.split('').map(c => String.fromCharCode(c.charCodeAt(0) + 2)).join('');
  
  if (enc === "J9274:") {
    window.location.href = "https://www.123684.com/s/YXhyVv-kcWsH";
  } else {
    const err = document.getElementById('err');
    const card = document.getElementById('card');
    err.classList.add('show');
    card.classList.add('shake');
    setTimeout(() => { card.classList.remove('shake'); }, 400);
  }
}
document.getElementById('pass').addEventListener('input', () => {
  document.getElementById('err').classList.remove('show');
});
</script>
</body>
</html>
