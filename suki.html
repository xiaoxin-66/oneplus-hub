<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="public">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SukiSU 验证 - 满天星</title>
<link rel="stylesheet" href="common.css">
<style>
.card-inner { padding: 36px 24px 28px; text-align: center; }
.icon { position: relative; width: 60px; height: 60px; margin: 0 auto 20px; border-radius: 18px; display: grid; place-items: center; background: rgba(59,157,255,.15); border: 1px solid rgba(255,255,255,.1); box-shadow: inset 0 2px 4px rgba(255,255,255,0.05); color: #3b9dff; z-index: 1; }
.icon::before { content: ''; position: absolute; inset: -6px; border-radius: 24px; background: #3b9dff; filter: blur(12px); z-index: -1; animation: iconPulse 2s infinite alternate; }
@keyframes iconPulse { 0% { opacity: .15; transform: scale(.9); } 100% { opacity: .4; transform: scale(1.1); } }
h2 { margin-bottom: 8px; font-size: 22px; font-weight: 800; letter-spacing: 1px; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
p { margin-bottom: 24px; font-size: 13px; color: rgba(255,255,255,0.6); text-shadow: 0 1px 4px rgba(0,0,0,0.5); line-height: 1.6; }
.input-group { position: relative; margin-bottom: 12px; z-index: 20; }
input { width: 100%; padding: 14px 44px; border-radius: 14px; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255,255,255,0.08); color: #fff; font-size: 16px; text-align: center; outline: none; transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1); font-family: inherit; letter-spacing: 2px; box-shadow: inset 0 2px 6px rgba(0,0,0,0.3); }
input::placeholder { letter-spacing: normal; color: rgba(255,255,255,.3); }
input:focus { border-color: rgba(59,157,255,0.6); box-shadow: inset 0 2px 6px rgba(0,0,0,0.3), 0 0 0 4px rgba(59,157,255,0.15), 0 0 20px rgba(59,157,255,0.3); background: rgba(0,0,0,0.5); transform: translateY(-2px); }

.eye { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; display: grid; place-items: center; background: transparent; border: none; color: rgba(255,255,255,.4); cursor: pointer; border-radius: 10px; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
.eye:hover { color: #fff; background: rgba(255,255,255,.1); }
.eye:active { transform: translateY(-50%) scale(0.7); background: rgba(255,255,255,.2); }
.eye svg { width: 18px; height: 18px; transition: transform 0.3s ease; }
.eye.active svg { color: #3b9dff; transform: scale(1.1); }

.err { color: #ff4d4d; font-size: 12px; height: 20px; margin-bottom: 12px; opacity: 0; transition: opacity .3s; text-shadow: 0 1px 3px rgba(0,0,0,0.8); font-weight: 500; }
.err.show { opacity: 1; }

button.verify { position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 15px; border-radius: 14px; background: linear-gradient(180deg, #3b9dff, #2f6bff); color: #fff; border: 1px solid rgba(255, 255, 255, 0.15); font-size: 15px; font-weight: bold; cursor: pointer; transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s, filter 0.2s; box-shadow: 0 8px 20px -6px rgba(59,157,255,0.4), inset 0 1px 1px rgba(255,255,255,0.3); margin-bottom: 24px; overflow: hidden; z-index: 20; transform: translateZ(0); }
button.verify::before { content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent); transform: skewX(-20deg); animation: shine 4s infinite; }
@keyframes shine { 0% { left: -100%; } 20% { left: 200%; } 100% { left: 200%; } }
button.verify:hover:not(:disabled) { filter: brightness(1.1); box-shadow: 0 10px 25px -5px rgba(59,157,255,0.6), inset 0 1px 1px rgba(255,255,255,0.5); }
button.verify:active:not(:disabled) { transform: scale(0.94) translateY(2px); box-shadow: 0 2px 5px -2px rgba(59,157,255,0.3), inset 0 3px 6px rgba(0,0,0,0.3); }
button.verify:disabled { background: #2a3245; color: rgba(255,255,255,.3); box-shadow: none; cursor: not-allowed; border-color: transparent; }
button.verify:disabled::before { display: none; }

.back-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: rgba(255,255,255,.7); text-decoration: none; font-size: 13px; font-weight: 500; padding: 10px 20px; border-radius: 100px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.1); transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); transform: translateZ(0); position: relative; z-index: 50; cursor: pointer; }
.back-btn:hover { color: #fff; background: rgba(255,255,255,.15); border-color: rgba(255,255,255,.2); }
.back-btn:active { transform: scale(0.9) translateZ(0); background: rgba(255,255,255,.2); }

.ripple { position: absolute; border-radius: 50%; background: rgba(255, 255, 255, 0.3); transform: scale(0); animation: rippleAnim 0.6s cubic-bezier(0.25, 1, 0.5, 1); pointer-events: none; }
@keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }

.btn-loading { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: btnSpin 0.6s linear infinite; }
@keyframes btnSpin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- 背景元素恢复 -->
<div class="nebula" aria-hidden="true"></div>
<div class="stars" aria-hidden="true"></div>
<div class="planet" aria-hidden="true" id="planet-bg"></div>
<div class="orb orb-1" aria-hidden="true"></div>
<div class="orb orb-2" aria-hidden="true"></div>

<main class="card">
  <div class="card-inner" id="card">
    <div class="icon">
      <!-- 补齐了锁的 SVG 图标 -->
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>
    <h2>SukiSU 验证</h2>
    <p>该资源为付费内容<br>请输入您购买后获取的密钥</p>

    <div class="input-group">
      <input type="password" id="pass" placeholder="请输入密钥" autocomplete="off" aria-describedby="err">
      <!-- 初始状态为闭眼 -->
      <button type="button" class="eye" id="eyeBtn" aria-label="显示或隐藏密钥">
        <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>
        </svg>
      </button>
    </div>
    <div class="err" id="err" role="alert"></div>

    <button class="verify" id="verifyBtn">验证并前往下载</button>

    <a href="index.html" class="back-btn" id="backBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="15 18 9 12 15 6"></polyline></svg>
      返回首页
    </a>
  </div>
</main>

<script src="common.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const KEY_HASH   = "380423258a33c2c583868f680484ac9741846f583a2730882f0ba379efd84c5b";
  const SALT_B64   = "6iRrrBIgb+VAeaumRGCFoQ==";
  const IV_B64     = "bH3f4QlL0CRHRyyD";
  const CIPHER_B64 = "Y8BLD3lFaoACJJ4Soh3SGJcMIN4kbVnlmmmk8BgMPW1jBuwKhX+V3H4hdEYIKmE7qm+teDQ=";

  const MAX_TRIES = 5;
  const LOCK_TIME = 10 * 60 * 1000;
  const passInput = document.getElementById('pass');
  const verifyBtn = document.getElementById('verifyBtn');
  const errText = document.getElementById('err');
  const card = document.getElementById('card');
  const eyeBtn = document.getElementById('eyeBtn');
  const eyeIcon = document.getElementById('eyeIcon');
  const backBtn = document.getElementById('backBtn');
  let timerInterval = null;

  const eyeOpenPath = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"></path><circle cx="12" cy="12" r="3"></circle>`;
  const eyeClosedPath = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;

  window.addEventListener('load', checkLockStatus);

  eyeBtn.addEventListener('click', () => {
    const isPassword = passInput.type === 'password';
    passInput.type = isPassword ? 'text' : 'password';
    
    if (isPassword) {
      eyeIcon.innerHTML = eyeOpenPath; 
      eyeBtn.classList.add('active');
    } else {
      eyeIcon.innerHTML = eyeClosedPath; 
      eyeBtn.classList.remove('active');
    }
    
    passInput.focus();
  });

  const b64ToU8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const u8ToHex = u8 => [...u8].map(b => b.toString(16).padStart(2, '0')).join('');

  async function verify() {
    const val = passInput.value.trim();
    if (!val || verifyBtn.disabled) return;
    verifyBtn.disabled = true;

    const originalText = verifyBtn.innerHTML;
    verifyBtn.innerHTML = '<span class="btn-loading"></span> 验证中...';

    try {
      const enc = new TextEncoder();
      const digest = await crypto.subtle.digest('SHA-256', enc.encode(val));
      
      if (u8ToHex(new Uint8Array(digest)) !== KEY_HASH) { 
        verifyBtn.innerHTML = originalText;
        handleFail(); 
        return; 
      }

      const baseKey = await crypto.subtle.importKey('raw', enc.encode(val), 'PBKDF2', false, ['deriveKey']);
      const aesKey = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: b64ToU8(SALT_B64), iterations: 100000, hash: 'SHA-256' },
        baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
      );
      const pt = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: b64ToU8(IV_B64) },
        aesKey, b64ToU8(CIPHER_B64)
      );
      const url = new TextDecoder().decode(pt);

      localStorage.removeItem('suki_fail_count');
      localStorage.removeItem('suki_lock_until');
      
      setTimeout(() => {
        window.location.replace(url);
      }, 300);

    } catch (e) {
      verifyBtn.innerHTML = originalText;
      handleFail();
    }
  }

  function handleFail() {
    let failCount = parseInt(localStorage.getItem('suki_fail_count') || '0') + 1;
    localStorage.setItem('suki_fail_count', failCount);
    const remain = MAX_TRIES - failCount;

    card.classList.add('shake');
    setTimeout(() => card.classList.remove('shake'), 400);

    if (failCount >= MAX_TRIES) {
      localStorage.setItem('suki_lock_until', Date.now() + LOCK_TIME);
      checkLockStatus();
    } else {
      showError(`密钥错误，您还有 ${remain} 次尝试机会`);
      passInput.value = '';
      passInput.focus();
      verifyBtn.disabled = false; 
    }
  }

  function showError(msg) { errText.innerText = msg; errText.classList.add('show'); }

  function checkLockStatus() {
    const lockUntil = localStorage.getItem('suki_lock_until');
    if (lockUntil && Date.now() < lockUntil) {
      passInput.disabled = true;
      verifyBtn.disabled = true;
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const left = lockUntil - Date.now();
        if (left <= 0) {
          clearInterval(timerInterval);
          localStorage.removeItem('suki_fail_count');
          localStorage.removeItem('suki_lock_until');
          unlockInputs();
        } else {
          const m = Math.floor(left / 60000);
          const s = Math.floor((left % 60000) / 1000);
          showError(`错误次数过多，请 ${m}分${s < 10 ? '0'+s : s}秒 后重试`);
        }
      }, 1000);
    } else {
      if (lockUntil) {
        localStorage.removeItem('suki_fail_count');
        localStorage.removeItem('suki_lock_until');
      }
      unlockInputs();
    }
  }

  function unlockInputs() {
    passInput.disabled = false;
    verifyBtn.disabled = false;
    errText.classList.remove('show');
    passInput.value = '';
    verifyBtn.innerHTML = '验证并前往下载';
  }

  passInput.addEventListener('input', () => errText.classList.remove('show'));
  passInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !verifyBtn.disabled) verify(); });
  verifyBtn.addEventListener('click', verify);

  backBtn.addEventListener('click', function(e) {
    if (this.dataset.loading) return;
    e.preventDefault();
    this.dataset.loading = "true";
    this.innerHTML = '<span class="btn-loading" style="border-top-color:#3b9dff; margin-right:6px;"></span> 加载中...';
    setTimeout(() => { window.location.href = 'index.html'; }, 300);
  });

  verifyBtn.addEventListener('click', function(e) {
    const rect = this.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const ripple = document.createElement('span');
    ripple.classList.add('ripple');
    ripple.style.left = `${x}px`;
    ripple.style.top = `${y}px`;
    ripple.style.width = ripple.style.height = `150px`; 
    ripple.style.marginLeft = `-75px`;
    ripple.style.marginTop = `-75px`;
    this.appendChild(ripple);
    setTimeout(() => { ripple.remove(); }, 600);
  });
});
</script>
</body>
</html>
