<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SukiSU 验证 - 满天星</title>
<link rel="stylesheet" href="common.css">
<style>
.card-inner { padding: 36px 24px 28px; text-align: center; }
.icon { position: relative; width: 60px; height: 60px; margin: 0 auto 20px; border-radius: 18px; display: grid; place-items: center; background: rgba(59,157,255,.15); border: 1px solid rgba(255,255,255,.1); color: #3b9dff; z-index: 1; }
.icon::before { content: ''; position: absolute; inset: -6px; border-radius: 24px; background: #3b9dff; filter: blur(12px); z-index: -1; animation: iconPulse 2s infinite alternate; }
@keyframes iconPulse { 0% { opacity: .15; transform: scale(.9); } 100% { opacity: .4; transform: scale(1.1); } }
h2 { margin-bottom: 8px; font-size: 22px; font-weight: 800; color: #fff; }
p { margin-bottom: 24px; font-size: 13px; color: rgba(255,255,255,0.6); line-height: 1.6; }
.input-group { position: relative; margin-bottom: 12px; z-index: 20; }
input { width: 100%; padding: 14px 44px; border-radius: 14px; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255,255,255,0.08); color: #fff; font-size: 16px; text-align: center; outline: none; font-family: inherit; letter-spacing: 2px; }
input:focus { border-color: rgba(59,157,255,0.6); box-shadow: 0 0 20px rgba(59,157,255,0.3); background: rgba(0,0,0,0.5); }
.eye { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; display: grid; place-items: center; background: transparent; border: none; color: rgba(255,255,255,.4); cursor: pointer; transition: all 0.3s; }
.eye svg { width: 18px; height: 18px; }
.eye.active svg { color: #3b9dff; }
.err { color: #ff4d4d; font-size: 12px; height: 20px; margin-bottom: 12px; opacity: 0; transition: opacity .3s; font-weight: 500; }
.err.show { opacity: 1; }
button.verify { width: 100%; padding: 15px; border-radius: 14px; background: linear-gradient(180deg, #3b9dff, #2f6bff); color: #fff; border: none; font-size: 15px; font-weight: bold; cursor: pointer; margin-bottom: 24px; transition: transform 0.2s; }
button.verify:active:not(:disabled) { transform: scale(0.96); }
button.verify:disabled { background: #2a3245; color: rgba(255,255,255,.3); cursor: not-allowed; }
.back-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: rgba(255,255,255,.7); text-decoration: none; font-size: 13px; padding: 10px 20px; border-radius: 100px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.1); }
.btn-loading { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: btnSpin 0.6s linear infinite; margin-right: 6px; }
@keyframes btnSpin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="nebula"></div><div class="stars"></div><div class="planet" id="planet-bg"></div><div class="orb orb-1"></div><div class="orb orb-2"></div>

<main class="card">
  <div class="card-inner" id="card">
    <div class="icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
    </div>
    <h2>SukiSU 验证</h2>
    <p>该资源为付费内容<br>请输入您购买后获取的密钥</p>
    <div class="input-group">
      <input type="password" id="pass" placeholder="请输入密钥" autocomplete="off">
      <button type="button" class="eye" id="eyeBtn">
        <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
      </button>
    </div>
    <div class="err" id="err"></div>
    <button class="verify" id="verifyBtn">验证并前往下载</button>
    <a href="index.html" class="back-btn" id="backBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="15 18 9 12 15 6"></polyline></svg>
      返回首页
    </a>
  </div>
</main>

<script src="common.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const KEY_HASH   = "380423258a33c2c583868f680484ac9741846f583a2730882f0ba379efd84c5b";
  const SALT_B64   = "6iRrrBIgb+VAeaumRGCFoQ==";
  const IV_B64     = "bH3f4QlL0CRHRyyD";
  const CIPHER_B64 = "Y8BLD3lFaoACJJ4Soh3SGJcMIN4kbVnlmmmk8BgMPW1jBuwKhX+V3H4hdEYIKmE7qm+teDQ=";

  const MAX_TRIES = 5;
  const LOCK_TIME = 10 * 60 * 1000;
  const passInput = document.getElementById('pass');
  const verifyBtn = document.getElementById('verifyBtn');
  const errText = document.getElementById('err');
  const card = document.getElementById('card');
  const eyeBtn = document.getElementById('eyeBtn');
  const eyeIcon = document.getElementById('eyeIcon');
  const backBtn = document.getElementById('backBtn');
  let timerInterval = null;

  const eyeOpenPath = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"></path><circle cx="12" cy="12" r="3"></circle>`;
  const eyeClosedPath = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;

  window.addEventListener('load', checkLockStatus);

  eyeBtn.addEventListener('click', () => {
    const isPassword = passInput.type === 'password';
    passInput.type = isPassword ? 'text' : 'password';
    if (isPassword) {
      eyeIcon.innerHTML = eyeOpenPath; 
      eyeBtn.classList.add('active');
    } else {
      eyeIcon.innerHTML = eyeClosedPath; 
      eyeBtn.classList.remove('active');
    }
    passInput.focus();
  });

  const b64ToU8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const u8ToHex = u8 => [...u8].map(b => b.toString(16).padStart(2, '0')).join('');

  async function verify() {
    const val = passInput.value.trim();
    if (!val || verifyBtn.disabled) return;
    verifyBtn.disabled = true;

    const originalText = verifyBtn.innerHTML;
    verifyBtn.innerHTML = '<span class="btn-loading"></span> 验证中...';

    try {
      const enc = new TextEncoder();
      const digest = await crypto.subtle.digest('SHA-256', enc.encode(val));
      
      if (u8ToHex(new Uint8Array(digest)) !== KEY_HASH) { 
        verifyBtn.innerHTML = originalText;
        handleFail(); 
        return; 
      }

      const baseKey = await crypto.subtle.importKey('raw', enc.encode(val), 'PBKDF2', false, ['deriveKey']);
      const aesKey = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: b64ToU8(SALT_B64), iterations: 100000, hash: 'SHA-256' },
        baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
      );
      const pt = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: b64ToU8(IV_B64) },
        aesKey, b64ToU8(CIPHER_B64)
      );
      const url = new TextDecoder().decode(pt);

      // ======= 核心：验证成功，把状态存入 localStorage =======
      localStorage.setItem('suki_is_paid', 'true');
      
      localStorage.removeItem('suki_fail_count');
      localStorage.removeItem('suki_lock_until');
      
      setTimeout(() => {
        window.location.replace(url);
      }, 50);

    } catch (e) {
      verifyBtn.innerHTML = originalText;
      handleFail();
    }
  }

  function handleFail() {
    let failCount = parseInt(localStorage.getItem('suki_fail_count') || '0') + 1;
    localStorage.setItem('suki_fail_count', failCount);
    const remain = MAX_TRIES - failCount;

    card.classList.add('shake');
    setTimeout(() => card.classList.remove('shake'), 400);

    if (failCount >= MAX_TRIES) {
      localStorage.setItem('suki_lock_until', Date.now() + LOCK_TIME);
      checkLockStatus();
    } else {
      showError(`密钥错误，您还有 ${remain} 次尝试机会`);
      passInput.value = '';
      passInput.focus();
      verifyBtn.disabled = false; 
    }
  }

  function showError(msg) { errText.innerText = msg; errText.classList.add('show'); }

  function checkLockStatus() {
    const lockUntil = localStorage.getItem('suki_lock_until');
    if (lockUntil && Date.now() < lockUntil) {
      passInput.disabled = true;
      verifyBtn.disabled = true;
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const left = lockUntil - Date.now();
        if (left <= 0) {
          clearInterval(timerInterval);
          localStorage.removeItem('suki_fail_count');
          localStorage.removeItem('suki_lock_until');
          unlockInputs();
        } else {
          const m = Math.floor(left / 60000);
          const s = Math.floor((left % 60000) / 1000);
          showError(`错误次数过多，请 ${m}分${s < 10 ? '0'+s : s}秒 后重试`);
        }
      }, 1000);
    } else {
      if (lockUntil) {
        localStorage.removeItem('suki_fail_count');
        localStorage.removeItem('suki_lock_until');
      }
      unlockInputs();
    }
  }

  function unlockInputs() {
    passInput.disabled = false;
    verifyBtn.disabled = false;
    errText.classList.remove('show');
    passInput.value = '';
    verifyBtn.innerHTML = '验证并前往下载';
  }

  passInput.addEventListener('input', () => errText.classList.remove('show'));
  passInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !verifyBtn.disabled) verify(); });
  verifyBtn.addEventListener('click', verify);

  backBtn.addEventListener('click', function(e) {
    if (this.dataset.loading) return;
    e.preventDefault();
    this.dataset.loading = "true";
    this.innerHTML = '<span class="btn-loading"></span> 加载中...';
    setTimeout(() => { window.location.href = 'index.html'; }, 50);
  });
});
</script>
</body>
</html>
